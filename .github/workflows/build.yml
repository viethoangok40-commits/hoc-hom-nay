name: Dựng và đăng HỌC HÔM NAY

on:
  push:
    branches: [main]
    paths:
      - 'bai/**'
      - 'assets/**'
      - 'templates/**'
      - 'lib/**'
      - 'build-album.mjs'
      - 'package.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dựng các bài trong bai/ và trang chủ
        run: node build-album.mjs --ra=_site
      - name: Kiểm tra có trang chủ và ít nhất 1 bài
        run: |
          test -s _site/index.html
          ls -la _site/bai
          test "$(ls _site/bai/*.html | wc -l)" -ge 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
