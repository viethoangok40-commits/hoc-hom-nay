name: Lấy bài từ Google Drive

# Giờ Việt Nam = UTC+7.  06:30, 07:30, 08:30, 12:30 (VN)  =  23:30 (hôm trước), 00:30, 01:30, 05:30 (UTC)
on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lay-va-dung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tải *-album.md từ Google Drive vào bai/
        id: lay
        run: node tools/lay-drive.mjs

      - name: Cài sharp (đổi hình sang WebP ≤ 1200 px)
        run: npm ci --no-audit --no-fund

      - name: Dựng các bài (tải hình nguồn, mô hình 3D) và trang chủ
        run: |
          node build-album.mjs --ra=_site
          for f in _site/bai/*.html; do s=$(stat -c%s "$f"); [ "$s" -lt 1572864 ] || echo "::warning file=$f::Trang bài nặng $((s/1024)) KB (> 1,5 MB trước khi tải 3D)"; done

      - name: Commit + push bài và hình mới (GITHUB_TOKEN)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bai assets/bai
          if git diff --cached --quiet; then
            echo "Không có bài hay hình mới."
          else
            git commit -m "Lấy bài từ Google Drive ($(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M') giờ VN)"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
              echo "Push lỗi, thử lại ($i)…"; sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::Không push được bài mới lên main"; exit 1; }
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: lay-va-dung
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
