<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Thẻ ôn thi: lọc vang là hoàn thiện">
<title>Thẻ ôn thi: lọc vang là hoàn thiện</title>
<defs><filter id="phan" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<g filter="url(#phan)"><g class="buoc"><rect x="70" y="50" width="500" height="310" rx="20" fill="none" stroke="#F2EFE6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="ve"/></g><g class="buoc"><text x="320" y="130" font-size="28" fill="#F2EFE6" text-anchor="middle" font-weight="500" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">Lọc rượu vang sau tàng trữ</text><text x="320" y="170" font-size="22" fill="#B9C7BD" text-anchor="middle" font-weight="500" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">loại cặn, tăng độ trong</text></g><g class="buoc"><path d="M320 195 L320 245 M313 230.6 L320 245 L327 230.6" fill="none" stroke="#F2C94C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="ve"/></g><g class="buoc"><text x="320" y="300" font-size="52" fill="#F2C94C" text-anchor="middle" font-weight="700" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">HOÀN THIỆN</text></g></g>
