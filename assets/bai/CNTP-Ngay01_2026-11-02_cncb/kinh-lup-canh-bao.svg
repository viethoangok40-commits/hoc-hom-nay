<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Đọc có phê phán: kiểm tra nghiên cứu gốc">
<title>Đọc có phê phán: kiểm tra nghiên cứu gốc</title>
<defs><filter id="phan" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<g filter="url(#phan)"><g class="buoc"><circle cx="260" cy="180" r="120" fill="none" stroke="#F2EFE6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="ve"/><line x1="345" y1="265" x2="460" y2="380" fill="none" stroke="#F2EFE6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" class="ve"/></g><g class="buoc"><path d="M260 110 L330 230 L190 230 Z" fill="none" stroke="#F2994A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="ve"/><line x1="260" y1="145" x2="260" y2="195" fill="none" stroke="#F2994A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="ve"/><circle cx="260" cy="212" r="6" fill="#F2994A"/></g><g class="buoc"><text x="500" y="120" font-size="22" fill="#B9C7BD" text-anchor="middle" font-weight="500" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">Tổng quan:</text><text x="500" y="150" font-size="22" fill="#B9C7BD" text-anchor="middle" font-weight="500" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">số liệu khác</text><text x="500" y="180" font-size="22" fill="#B9C7BD" text-anchor="middle" font-weight="500" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">điều kiện</text><text x="500" y="240" font-size="24" fill="#F2C94C" text-anchor="middle" font-weight="700" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">đối chiếu</text><text x="500" y="272" font-size="24" fill="#F2C94C" text-anchor="middle" font-weight="700" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">nghiên cứu gốc</text></g></g>
</svg>
