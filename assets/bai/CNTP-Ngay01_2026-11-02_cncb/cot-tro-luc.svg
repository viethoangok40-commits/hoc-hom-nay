<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Lớp bánh chiếm 69–94% tổng trở lực">
<title>Lớp bánh chiếm 69–94% tổng trở lực</title>
<defs><filter id="phan" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<g filter="url(#phan)"><g class="buoc"><line x1="80" y1="340" x2="580" y2="340" fill="none" stroke="#B9C7BD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="ve"/><line x1="80" y1="340" x2="80" y2="40" fill="none" stroke="#B9C7BD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="ve"/></g><g class="buoc dong-len"><rect x="130" y="290" width="100" height="50" rx="4" fill="none" stroke="#F2EFE6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="ve"/><text x="180" y="375" font-size="20" fill="#F2EFE6" text-anchor="middle" font-weight="500" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">màng</text></g><g class="buoc dong-len"><rect x="280" y="270" width="100" height="70" rx="4" fill="none" stroke="#F2EFE6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="ve"/><text x="330" y="375" font-size="20" fill="#F2EFE6" text-anchor="middle" font-weight="500" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">trong mao dẫn</text></g><g class="buoc dong-len"><rect x="430" y="80" width="100" height="260" rx="4" fill="none" stroke="#F2C94C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="ve"/><text x="480" y="375" font-size="20" fill="#F2C94C" text-anchor="middle" font-weight="500" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">lớp bánh (cake)</text></g><g class="buoc"><text x="480" y="62" font-size="34" fill="#F2C94C" text-anchor="middle" font-weight="700" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">69–94%</text></g></g>
</svg>
