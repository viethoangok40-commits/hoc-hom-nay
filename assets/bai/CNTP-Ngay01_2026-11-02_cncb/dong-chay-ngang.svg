<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Tăng vận tốc dòng ngang">
<title>Tăng vận tốc dòng ngang</title>
<defs><filter id="phan" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<g filter="url(#phan)"><g class="buoc"><line x1="30" y1="120" x2="610" y2="120" fill="none" stroke="#F2EFE6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="ve"/><line x1="30" y1="300" x2="610" y2="300" fill="none" stroke="#F2EFE6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="ve"/><line x1="30" y1="300" x2="610" y2="300" fill="none" stroke="#F2C94C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10" class="ve"/></g><g class="buoc dong-phai"><path d="M70 180 L190 180 M175.6 187 L190 180 L175.6 173" fill="none" stroke="#F2EFE6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="ve"/><text x="130" y="160" font-size="22" fill="#F2EFE6" text-anchor="middle" font-weight="500" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">0,1 m/s</text></g><g class="buoc dong-phai"><path d="M300 230 L590 230 M575.6 237 L590 230 L575.6 223" fill="none" stroke="#7FB8E0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" class="ve"/><text x="445" y="200" font-size="30" fill="#7FB8E0" text-anchor="middle" font-weight="700" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">0,5 m/s</text></g><g class="buoc"><text x="320" y="370" font-size="24" fill="#F2C94C" text-anchor="middle" font-weight="500" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">có bộ tạo rối → lưu lượng tăng ~155%</text></g></g>
</svg>
