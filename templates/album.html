<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>__TITLE__</title>
<style>
__FONTS__
:root{
  --board:#1E2B25; --board-2:#24352d; --chalk:#F2EFE6; --dim:#B9C7BD; --yel:#F2C94C; --red:#E86A5A; --blu:#7FB8E0; --grn:#8FD18B; --org:#F2994A;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --body:"Be Vietnam Pro","Segoe UI",system-ui,Arial,sans-serif;
  --hand:"Be Vietnam Pro","Segoe UI",system-ui,Arial,sans-serif;
  --fs:clamp(15px,min(0.9rem + 0.55vw,1.2rem + 1.1vh),27px);
  --pad:clamp(16px,3vw,44px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--chalk);font-family:var(--body);font-size:var(--fs);line-height:1.55;overflow:hidden;
  background-image:radial-gradient(ellipse 80% 60% at 25% 15%,rgba(255,255,255,.055),transparent 65%),radial-gradient(ellipse 70% 60% at 85% 90%,rgba(255,255,255,.035),transparent 60%);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--yel)}
code{font-size:.9em;background:rgba(0,0,0,.25);padding:0 .3em;border-radius:4px}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px;border-radius:6px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#prog{position:fixed;top:0;left:0;height:5px;width:100%;background:rgba(242,239,230,.12);z-index:30;overflow:hidden}
#prog i{display:block;height:100%;width:100%;background:var(--yel);transform:scaleX(0);transform-origin:left center;transition:transform .3s var(--ease-out)}
#top{display:flex;align-items:center;gap:12px;padding:12px var(--pad) 6px;min-height:58px}
#top .lbl{flex:1;min-width:0;color:var(--dim);font-size:.76em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .cnt{color:var(--dim);font-size:.76em;font-variant-numeric:tabular-nums}
.ib{min-width:48px;min-height:48px;border:2px solid rgba(242,239,230,.55);border-radius:14px;display:grid;place-items:center;font-size:1.05em;line-height:1}
@media (hover:hover) and (pointer:fine){.ib:hover{border-color:var(--yel);color:var(--yel)}}
.ib:active{transform:scale(.97)}
#stage{flex:1;min-height:0;position:relative;cursor:pointer}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:2px var(--pad) 6px;overflow:hidden;font-size:calc(1em * var(--k,1))}
.scr[hidden]{display:none}
.scr>header{display:flex;align-items:baseline;gap:16px;margin:0 0 10px;flex:none}
.scr .num{font-family:var(--hand);color:var(--yel);font-size:1.45em;white-space:nowrap}
.scr h1{font-family:var(--hand);font-weight:700;font-size:1.4em;line-height:1.15;margin:0;text-wrap:balance}
/* cảnh: bảng (hình + chữ trên bảng) + lời giảng */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(16px,3vw,44px)}
.body.phai .bang{order:2}
.body.nofig{grid-template-columns:minmax(0,1fr);max-width:46em;margin-inline:auto;width:100%}
.bang{display:flex;flex-direction:column;min-height:0;gap:10px}
.figbox{flex:1;min-height:0;position:relative}
.figbox.empty{display:none}
.fig{position:absolute;inset:0;display:grid;place-items:center}
.fig[hidden]{display:none}
.fig>svg,.fig>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;overflow:visible}
.fig canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.fig .m3d{position:absolute;inset:0}
.fig.has-credit>svg,.fig.has-credit>img{height:calc(100% - 2.4em)}
.fig .credit{position:absolute;left:0;right:0;bottom:0;font-size:.58em;line-height:1.3;color:var(--dim);text-align:center;max-height:2.7em;overflow:hidden;padding:0 4px}
.fig .credit a{color:var(--dim);text-decoration:underline;text-underline-offset:2px}
.fig .nguon-box{border:2px dashed rgba(242,239,230,.5);border-radius:14px;padding:16px 20px;max-width:92%;text-align:center;font-size:.82em;line-height:1.45}
.fig .nguon-box small{color:var(--dim)}
.fig .nguon-box a{word-break:break-all}
.fig .mol{position:absolute;inset:0 0 2.4em 0;touch-action:none}
.fig .mol canvas{touch-action:none}
.fig .mol-hint{position:absolute;top:2px;right:6px;font-size:.6em;color:var(--dim);pointer-events:none;background:rgba(30,43,37,.7);padding:2px 8px;border-radius:999px}
.fig .m3d-hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:.7em;color:var(--dim);pointer-events:none}
.chalkboard{flex:none;max-height:42%;overflow-y:auto;font-family:var(--hand);font-weight:600;font-size:1.08em;line-height:1.35;border:3px solid rgba(242,239,230,.8);border-radius:14px 10px 16px 9px;padding:10px 16px;background:rgba(0,0,0,.14);scrollbar-width:thin}
.chalkboard[hidden]{display:none}
.chalkboard p{margin:.12em 0;opacity:.62;transition:opacity .25s var(--ease-out),color .25s var(--ease-out)}
.chalkboard p.moi{opacity:1;color:var(--yel)}
.figbox.empty+.chalkboard{max-height:none;flex:1;font-size:1.5em;display:flex;flex-direction:column;justify-content:center}
.txt{overflow-y:auto;overscroll-behavior:contain;padding:4px 10px 24px 4px;scrollbar-width:thin;scrollbar-color:rgba(242,239,230,.35) transparent}
.step{margin:0 0 .85em;max-width:36em;opacity:0;transform:translateY(8px);transition:opacity .24s var(--ease-out),transform .24s var(--ease-out);padding-left:14px;border-left:4px solid transparent;text-wrap:pretty}
.step[hidden]{display:none}
.step.on{opacity:.78;transform:none}
.step.cur{opacity:1;border-left-color:var(--yel)}
.step .tag{display:inline-block;font-size:.72em;color:var(--board);background:var(--dim);border-radius:999px;padding:1px 10px;margin-right:8px;vertical-align:2px;font-weight:700}
.step.hook{font-style:italic;color:var(--yel)}
.step.hook::before{content:"? ";font-family:var(--hand);font-style:normal}
.step.deep .tag{background:var(--blu)}
.step.formula{font-family:var(--hand);font-size:1.25em}
.step.formula .tag{font-family:var(--body);font-size:.58em;background:var(--yel)}
.step .sc{display:block;font-size:.72em;color:var(--dim);margin-top:4px}
.guide{color:var(--dim);font-style:italic;margin:.6em 0 .8em;max-width:36em}
.cite{font-size:.78em;color:var(--dim);border:2px solid rgba(242,239,230,.45);border-radius:10px;padding:8px 14px;max-width:44em;margin-top:.6em}
.cite b{color:var(--yel)}
.guide,.cite{opacity:0;transition:opacity .24s var(--ease-out)}
.guide.on,.cite.on{opacity:1}
.guide[hidden],.cite[hidden]{display:none}
#bot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px var(--pad) 10px}
.hm{display:none} @media (max-width:820px),(pointer:coarse){.hd{display:none}.hm{display:inline}}
#bot .mid{color:var(--dim);font-size:.7em;text-align:center;flex:1;transition:opacity 1s linear}
/* thẻ */
.cards{overflow-y:auto;flex:1;min-height:0;padding:4px 8px 24px 2px;max-width:60em;width:100%;margin-inline:auto;scrollbar-width:thin}
.card{border:3px solid rgba(242,239,230,.7);border-radius:14px 10px 16px 9px;padding:14px 18px;margin:0 0 16px;opacity:0;transform:translateY(8px);transition:opacity .24s var(--ease-out),transform .24s var(--ease-out)}
.card.on{opacity:1;transform:none}
.card[hidden]{display:none}
.card h2{font-family:var(--hand);color:var(--yel);font-size:1em;margin:0 0 6px;font-weight:600}
.card p{margin:.4em 0}
.card ul,.card ol{margin:.3em 0;padding-left:1.3em}
.card .lang{color:var(--dim);font-size:.86em}
table.tb{border-collapse:collapse;width:100%;font-size:.84em}
.tb th,.tb td{border-bottom:1px solid rgba(242,239,230,.28);padding:7px 10px;text-align:left;vertical-align:top}
.tb th{color:var(--yel);font-weight:600}
.tb td:first-child{color:var(--dim);white-space:nowrap}
.cover{display:flex;flex-direction:column;justify-content:center;flex:1;min-height:0;max-width:46em;margin-inline:auto;width:100%;overflow-y:auto}
.cover .big{font-family:var(--hand);font-weight:700;font-size:2em;line-height:1.1;margin:.1em 0 .3em;color:var(--chalk)}
.cover .kick{font-family:var(--hand);color:var(--yel);font-size:1.4em}
.cover .meta{color:var(--dim);font-style:italic}
.cover .intro p{margin:.35em 0}
/* trắc nghiệm */
.opt{display:block;width:100%;text-align:left;padding:11px 16px;margin:8px 0;border:2px solid var(--chalk);border-radius:12px;min-height:50px;font-size:.92em;transition:background-color .18s var(--ease-out),border-color .18s var(--ease-out),opacity .18s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.opt:not([disabled]):hover{border-color:var(--yel)}}
.opt.good{border-color:var(--grn);background:rgba(143,209,139,.16)}
.opt.bad{border-color:var(--red);opacity:.7}
.opt.dim{opacity:.5}
.expl{margin-top:10px;padding-top:8px;border-top:2px dashed rgba(242,239,230,.4)}
.expl[hidden]{display:none}
.score{color:var(--yel);font-family:var(--hand);margin:0 0 10px;font-size:1.15em}
.score .pass{color:var(--grn)} .score .fail{color:var(--org)}
.term .w{font-family:var(--hand);font-size:1.35em;color:var(--yel)}
.term .ipa{color:var(--dim);margin-left:10px}
.term .pos{display:inline-block;border:2px solid var(--dim);border-radius:999px;padding:0 10px;font-size:.74em;margin-left:8px}
/* mục lục */
#toc{position:fixed;inset:0;z-index:40;background:rgba(14,22,18,.97);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px}
#toc.open{display:flex}
#toc header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
#toc h2{font-family:var(--hand);margin:0;font-size:1.2em;color:var(--yel);font-weight:700}
#toc .list{overflow-y:auto;flex:1;padding-right:8px}
#toc h3{font-size:.95em;color:var(--yel);margin:18px 0 6px;font-weight:600}
#toc button.it{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;padding:9px 12px;min-height:46px;border-radius:10px;font-size:.86em;border:2px solid transparent}
#toc button.it .n{color:var(--yel);min-width:3.2em;font-variant-numeric:tabular-nums}
#toc button.it.cur{border-color:var(--yel)}
#toc button.it.seen .n::after{content:" ✓";color:var(--grn)}
@media (hover:hover) and (pointer:fine){#toc button.it:hover{background:rgba(242,239,230,.09)}}
/* nút + bảng "📚 Bài khác" */
#top .ib.bk-btn{padding:0 12px;font-size:.78em;font-weight:600;white-space:nowrap;gap:6px;grid-auto-flow:column}
#lib{position:fixed;inset:0;z-index:41;background:#111a15;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) var(--pad) calc(env(safe-area-inset-bottom) + 12px)}
#lib.open{display:flex}
#lib header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
#lib h2{font-family:var(--hand);margin:0;font-size:1.2em;color:var(--yel);font-weight:700}
#lib .loc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
#lib .loc button{border:2px solid rgba(242,239,230,.45);border-radius:999px;padding:6px 14px;min-height:44px;font-weight:600;font-size:.8em;color:var(--dim)}
#lib .loc button .so{font-weight:400;opacity:.8;margin-left:4px}
#lib .loc button[aria-pressed="true"]{color:var(--board);background:var(--chalk);border-color:var(--chalk)}
#lib .loc button.cntp[aria-pressed="true"]{background:var(--org);border-color:var(--org)}
#lib .loc button.rnd[aria-pressed="true"]{background:var(--blu);border-color:var(--blu)}
#lib .list{overflow-y:auto;flex:1;padding-right:8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#lib h3{font-size:.8em;color:var(--dim);font-weight:600;margin:16px 0 4px;border-bottom:1px solid rgba(242,239,230,.22);padding-bottom:4px}
#lib h3 .hn{color:var(--board);background:var(--yel);border-radius:999px;padding:0 10px;margin-left:8px;font-size:.85em}
#lib a.bk{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:10px;min-height:48px;border-radius:10px;font-size:.86em;color:var(--chalk);text-decoration:none;border-left:4px solid transparent}
#lib a.bk.cntp{border-left-color:rgba(242,153,74,.6)} #lib a.bk.rnd{border-left-color:rgba(127,184,224,.6)}
#lib a.bk.cur{background:rgba(242,239,230,.09)}
#lib a.bk .t{flex:1 1 14em}
#lib a.bk .o{font-size:.8em;color:var(--yel)}
@media (hover:hover) and (pointer:fine){#lib a.bk:hover{background:rgba(242,239,230,.09)}#lib .loc button[aria-pressed="false"]:hover{border-color:var(--chalk);color:var(--chalk)}}
.nhan{display:inline-block;font-size:.78em;font-weight:700;line-height:1.5;border-radius:999px;padding:1px 10px;white-space:nowrap;border:2px solid currentColor}
.nhan.cntp{color:var(--org);background:rgba(242,153,74,.14)} .nhan.rnd{color:var(--blu);background:rgba(127,184,224,.14)} .nhan.khac{color:var(--dim)}
#selftest-result{position:fixed;left:-9999px;top:0;white-space:pre}
/* hình: cách hiện */
@keyframes ve{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes mo{from{opacity:0}to{opacity:1}}
@keyframes truot{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes buoc{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes quay{to{transform:rotate(360deg)}}
@keyframes len{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes phai{0%{transform:translateX(0)}60%{transform:translateX(230px);opacity:1}61%{opacity:0}100%{transform:translateX(0);opacity:0}}
@keyframes troi{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fig.play.h-ve-net .ve-s{stroke-dasharray:1;animation:ve 1.6s var(--ease-out) both;animation-delay:calc(var(--i,0) * .06s)}
.fig.play.h-ve-net text{animation:mo .8s .9s both}
.fig.play.h-mo-dan>*{animation:mo .9s var(--ease-out) both}
.fig.play.h-truot-vao>*{animation:truot .7s var(--ease-out) both}
.fig.play.h-dung-tung-buoc .buoc{animation:buoc .5s var(--ease-out) both;animation-delay:calc(var(--i,0) * .38s)}
.fig.play.h-chuyen-dong>*{animation:mo .5s var(--ease-out) both}
.fig.play .dong-quay{animation:quay 6s linear infinite;transform-box:view-box}
.fig.play .dong-len{animation:len 2.6s ease-in-out infinite}
.fig.play .dong-phai{animation:phai 3.2s ease-in-out infinite}
.fig.play.h-chuyen-dong.real>*{animation:mo .5s both,troi 4s ease-in-out .5s infinite}
#stage{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.txt,.cards,.chalkboard{-webkit-user-select:text;user-select:text}
.tap-hint{position:absolute;z-index:5;top:0;bottom:0;width:50%;pointer-events:none;opacity:0;transition:opacity .25s}
.tap-hint.l{left:0;background:linear-gradient(90deg,rgba(242,239,230,.10),transparent)}
.tap-hint.r{right:0;background:linear-gradient(270deg,rgba(242,239,230,.10),transparent)}
.tap-hint.on{opacity:1;transition:none}
@media (max-width:820px){
  #top{padding:8px var(--pad) 4px;min-height:52px}
  .ib{min-width:44px;min-height:44px}
  .figbox{min-height:120px}
  .body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,38vh) minmax(0,1fr);gap:10px}
  .body.phai .bang{order:0}
  .body.nofig{grid-template-rows:minmax(0,1fr)}
  .chalkboard{font-size:.95em;max-height:45%}
  .cover .big{font-size:1.6em}
  .scr>header{flex-direction:column;gap:0}
}
@media (max-height:520px) and (orientation:landscape){.scr>header{display:none}#top{min-height:46px;padding-block:4px}}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
  .step,.card{transform:none!important;transition:opacity .15s linear!important}
  .fig.play *,.fig.play>*{animation-duration:.2s!important;animation-iteration-count:1!important;animation-delay:0s!important}
  .fig.play .dong-quay,.fig.play .dong-len,.fig.play .dong-phai{animation:none!important}
  .fig.play .ve-s{stroke-dasharray:none!important}
  #prog i{transition:none!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<filter id="phan" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="d"/><feComponentTransfer in="n" result="g"><feFuncA type="discrete" tableValues="0 1 1 1 0 1 1 1"/></feComponentTransfer><feComposite in="d" in2="g" operator="in"/></filter>
</defs></svg>
<div id="prog"><i></i></div>
<div id="app">
  <div id="top">
    <button class="ib" id="btn-toc" aria-label="Mục lục (phím M)" aria-expanded="false">☰</button>
    <button class="ib bk-btn" id="btn-lib" aria-label="Bài khác – danh sách mọi bài học (phím B)" aria-expanded="false"><span aria-hidden="true">📚</span><span>Bài khác</span></button>

    <button class="ib" id="btn-prev" aria-label="Lùi một ý (mũi tên trái)">‹</button>
    <div class="mid" id="hint"><span class="hd">Bấm nửa phải, → hoặc Space: ý sau · nửa trái hoặc ←: lùi · M: mục lục</span><span class="hm">Chạm phải: tiếp · chạm trái: lùi · vuốt được</span></div>
    <button class="ib" id="btn-next" aria-label="Ý tiếp theo (Space hoặc mũi tên phải)">›</button>

</div>
<nav id="toc" aria-label="Mục lục" hidden><header><h2>Mục lục</h2><button class="ib" id="toc-close" aria-label="Đóng mục lục">✕</button></header><div class="list" id="toc-list"></div></nav>
<nav id="lib" aria-label="Bài khác" hidden><header><h2>📚 Bài khác</h2><button class="ib" id="lib-close" aria-label="Đóng danh sách bài">✕</button></header>
  <div class="loc" role="group" aria-label="Lọc loại bài">

    <button type="button" data-loc="cntp" class="cntp" aria-pressed="false">Bàn học CNTP<span class="so"></span></button>
    <button type="button" data-loc="rnd" class="rnd" aria-pressed="false">R&amp;D Food Lab<span class="so"></span></button>
  </div>
  <div class="list" id="lib-list"></div></nav>
<script type="application/json" id="data">__DATA__</script>
<pre id="selftest-result"></pre>

<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('data').textContent);
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(s,r){return (r||document).querySelector(s)};
var stage=$('#stage'),lbl=$('#lbl'),cnt=$('#cnt'),prog=$('#prog i'),toc=$('#toc'),tocList=$('#toc-list');
function el(tag,cls,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e}
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function reveal(node,on){ if(!node) return; if(on){ if(node.hidden){node.hidden=false; void node.offsetWidth;} node.classList.add('on'); } else { node.classList.remove('on'); node.hidden=true; } }
function scrollTo(n){ if(n) try{n.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'})}catch(e){} }

/* ---------- hình ---------- */
var figCache={};
function makeFig(id){
  var f=D.figs[id]; if(!f) return null;
  var w=el('div','fig'); w.hidden=true; w.dataset.id=id;
  var hien=(f.hien||'mo-dan').replace(/[^a-z-]/g,''); if(!/^(ve-net|mo-dan|truot-vao|dung-tung-buoc|chuyen-dong)$/.test(hien)) hien='mo-dan';
  w.dataset.hien=hien;

  screens.forEach(function(s,i){
    if(s.group!==g){g=s.group; tocList.appendChild(el('h3',null,g.replace(/</g,'&lt;')));}
    var b=el('button','it'+(i===sc?' cur':'')+(seen[s.id]?' seen':'')); b.type='button';
    var m=/^([\d.]+)\s(.*)$/.exec(s.label); b.innerHTML='<span class="n">'+(m?m[1]:'')+'</span><span>'+(m?m[2]:s.label).replace(/</g,'&lt;')+'</span>';
    b.addEventListener('click',function(){jump(s.id,1)}); tocList.appendChild(b);
  });
}
function openToc(){buildToc(); toc.hidden=false; toc.classList.add('open'); $('#btn-toc').setAttribute('aria-expanded','true'); var c=$('#toc .it.cur'); if(c) c.scrollIntoView({block:'center'}); $('#toc-close').focus();}
function closeToc(){toc.classList.remove('open'); toc.hidden=true; $('#btn-toc').setAttribute('aria-expanded','false');}
$('#btn-toc').addEventListener('click',function(e){e.stopPropagation(); closeLib(); openToc()});

/* ---------- 📚 Bài khác: danh sách mọi bài, lọc theo loại, mới nhất trên ---------- */
var lib=$('#lib'), libList=$('#lib-list'), DS=D.ds||[], libV='tat-ca', dsTried=false, LKEY='hoc-hom-nay:loc';
var LOAI={cntp:'Bàn học CNTP',rnd:'R&D Food Lab'}, THU=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
function escH(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function vnToday(){ try{ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }catch(e){ return new Date(Date.now()+7*3600e3).toISOString().slice(0,10); } }
function vnDate(ymd){ var a=String(ymd).split('-'); if(a.length<3) return ymd; var d=new Date(Date.UTC(+a[0],+a[1]-1,+a[2])); return THU[d.getUTCDay()]+', '+a[2]+'/'+a[1]+'/'+a[0]; }
function gOf(it){ if(it.nhom) return it.nhom; var n=it.md||''; return /^CNTP-/i.test(n)?'cntp':/^D0/i.test(n)?'rnd':''; }
function fileOf(it){ return String(it.f||'').replace(/^bai\//,''); }
function openInParent(it){ // đang nằm trong khung của trang chủ → để trang chủ mở bài (cập nhật tiêu đề, đánh dấu)
  try{ if(window.parent&&window.parent!==window&&typeof window.parent.__hhnOpen==='function') return window.parent.__hhnOpen(it.f)!==false; }catch(e){}
  return false;
}
function buildLib(){
  var dem={'tat-ca':DS.length,cntp:0,rnd:0}; DS.forEach(function(it){ var g=gOf(it); if(g&&dem[g]!==undefined) dem[g]++; });
  [].forEach.call(lib.querySelectorAll('.loc button'),function(b){ var k=b.getAttribute('data-loc'); b.setAttribute('aria-pressed',String(k===libV)); b.querySelector('.so').textContent='('+(dem[k]||0)+')'; });
  libList.innerHTML=''; var last='', shown=0, td=vnToday();
  DS.forEach(function(it){
    var g=gOf(it); if(libV!=='tat-ca'&&g!==libV) return; shown++;
    if(it.date!==last){ last=it.date; libList.appendChild(el('h3',null,escH(vnDate(it.date))+(it.date===td?'<span class="hn">hôm nay</span>':''))); }
    var me=!!D.self&&fileOf(it)===D.self;
    var nh=g?'<span class="nhan '+g+'">'+escH(LOAI[g])+'</span>':(it.mon?'<span class="nhan khac">'+escH(it.mon)+'</span>':'');
    var a=el('a','bk '+(g||'khac')+(me?' cur':''),nh+'<span class="t">'+escH(it.topic||it.title)+'</span>'+(me?'<span class="o">đang mở</span>':''));
    a.href=fileOf(it); a.title=it.title||''; a.setAttribute('data-f',it.f); if(me) a.setAttribute('aria-current','page');
    a.addEventListener('click',function(e){ if(e.ctrlKey||e.metaKey||e.shiftKey) return; if(me){ e.preventDefault(); closeLib(); return; } if(openInParent(it)){ e.preventDefault(); closeLib(); } });
    libList.appendChild(a);
  });
  if(!shown) libList.appendChild(el('p','lang','Chưa có bài nào thuộc loại này.'));
}
function loadDs(){ // lấy danh sách mới nhất (bài đăng sau khi trang này được dựng); lỗi/offline → giữ danh sách nhúng
  if(dsTried||!window.fetch||location.protocol==='file:') return; dsTried=true;
  try{ fetch('danh-sach.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).then(function(j){ if(j&&j.items&&j.items.length){ DS=j.items; if(lib.classList.contains('open')) buildLib(); } }).catch(function(){}); }catch(e){}
}
function openLib(){
  closeToc(); var v=safeGet(LKEY); libV=/^(tat-ca|cntp|rnd)$/.test(v||'')?v:'tat-ca';
  buildLib(); lib.hidden=false; lib.classList.add('open'); $('#btn-lib').setAttribute('aria-expanded','true');
  var c=libList.querySelector('.bk.cur'); if(c) try{c.scrollIntoView({block:'center'})}catch(e){}
  $('#lib-close').focus(); loadDs();
}
function closeLib(){ if(!lib.classList.contains('open')) return; lib.classList.remove('open'); lib.hidden=true; $('#btn-lib').setAttribute('aria-expanded','false'); }
[].forEach.call(lib.querySelectorAll('.loc button'),function(b){ b.addEventListener('click',function(){ libV=b.getAttribute('data-loc'); safeSet(LKEY,libV); buildLib(); }); });
$('#btn-lib').addEventListener('click',function(e){e.stopPropagation(); openLib()});
$('#lib-close').addEventListener('click',closeLib);
$('#toc-close').addEventListener('click',closeToc);
$('#btn-next').addEventListener('click',function(e){e.stopPropagation(); next()});
$('#btn-prev').addEventListener('click',function(e){e.stopPropagation(); prev()});
function flash(side){ var h=stage.querySelector('.tap-hint.'+side); if(!h) return; h.classList.add('on'); setTimeout(function(){h.classList.remove('on')},180); }
stage.addEventListener('click',function(e){
  if(e.target.closest('a,button,table,.opt,canvas,.mol,.m3d,input,select,textarea')) return;
  if(window.getSelection&&String(window.getSelection())) return;
  var r=stage.getBoundingClientRect();
  if(e.clientX < r.left + r.width/2){ flash('l'); prev(); } else { flash('r'); next(); }
});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(toc.classList.contains('open')){ if(e.key==='Escape') closeToc(); return; }
  if(lib.classList.contains('open')){ if(e.key==='Escape') closeLib(); return; }
  if(e.key==='b'||e.key==='B'){ openLib(); return; }
  var k=e.key;
  if(k===' '||k==='ArrowRight'||k==='Enter'||k==='PageDown'){ if(document.activeElement&&document.activeElement.classList.contains('opt')&&(k==='Enter'||k===' ')) return; e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){ e.preventDefault(); prev(); }
  else if(k==='Home'){ e.preventDefault(); sc=0; st=1; render(); }
  else if(k==='End'){ e.preventDefault(); sc=screens.length-1; st=inst(sc).n; render(); }
  else if(k==='m'||k==='M'){ openToc(); }
});
var tx=null;
stage.addEventListener('touchstart',function(e){ if(e.target.closest&&e.target.closest('.mol,.m3d,canvas')){ tx=null; return; } if(e.touches.length===1) tx={x:e.touches[0].clientX,y:e.touches[0].clientY} },{passive:true});
stage.addEventListener('touchend',function(e){ if(!tx) return; var t=e.changedTouches[0],dx=t.clientX-tx.x,dy=t.clientY-tx.y; tx=null; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){ stage.__sw=Date.now(); if(dx<0){flash('r'); next();} else {flash('l'); prev();} } },{passive:true});
stage.addEventListener('click',function(e){ if(stage.__sw&&Date.now()-stage.__sw<400) e.stopImmediatePropagation(); },true);

/* ---------- tự kiểm tra: ?selftest ---------- */
function selftest(){
  var rep={errors:[],screens:screens.length,steps:0,stuck:[],figsShown:0,figsTotal:Object.keys(D.figs).length,quizCards:0,quizNoExpl:0};
  var errs=[]; window.addEventListener('error',function(e){errs.push(String(e.message))});
  try{
    screens.forEach(function(s,i){ var it=inst(i); sc=i;
      for(var k=1;k<=it.n;k++){ st=k; render(); rep.steps++; if(it.el.hidden) rep.stuck.push(s.id+'#'+k);
        var vis=it.el.querySelectorAll('.step.on').length, all=it.el.querySelectorAll('.step').length; if(all&&vis!==Math.min(k,all)) rep.stuck.push(s.id+'#'+k+' '+vis+'/'+Math.min(k,all));
        [].forEach.call(it.el.querySelectorAll('.fig:not([hidden])'),function(f){ if(!f.__seen){f.__seen=1; rep.figsShown++;} }); }
      [].forEach.call(it.el.querySelectorAll('.card'),function(c){ var b=c.querySelector('.opt'); if(b){ rep.quizCards++; b.click(); var ex=c.querySelector('.expl'); if(!ex||ex.hidden) rep.stuck.push('quiz '+s.id); else if(/không ghi đáp án/.test(ex.textContent)) rep.quizNoExpl++; } });
    });
    sc=0; st=1; render(); var g=0,n=0; while(!(sc===screens.length-1&&st>=inst(sc).n)&&g<20000){ var a=sc+':'+st; next(); n++; g++; if(sc+':'+st===a){rep.stuck.push('kẹt '+a); break;} }
    rep.nextSteps=n; rep.totalSteps=total-1;
    openToc(); rep.toc=tocList.querySelectorAll('button.it').length; closeToc();
    libV='tat-ca'; buildLib(); rep.lib=libList.querySelectorAll('a.bk').length; rep.libTotal=DS.length;
  }catch(e){ rep.errors.push(String(e&&e.stack||e)); }
  rep.errors=rep.errors.concat(errs);
  rep.ok=!rep.errors.length&&!rep.stuck.length&&rep.nextSteps===rep.totalSteps&&rep.toc===screens.length&&rep.lib===rep.libTotal;
  $('#selftest-result').textContent=JSON.stringify(rep); document.title=(rep.ok?'SELFTEST OK ':'SELFTEST LỖI ')+rep.steps+' bước';
  try{localStorage.removeItem(KEY)}catch(e){}
}
if(/selftest/.test(location.search+location.hash)) selftest();
else { fromHash(); render(); var hh=$('#hint'); hh.style.transition='opacity 1s'; setTimeout(function(){hh.style.opacity='0'},9000); }
window.addEventListener('hashchange',function(){ if(fromHash()) render(); });
})();
</script>
