button.pri{background:var(--accent);color:var(--bg)}

.mapwrap .ed{stroke:var(--muted);stroke-width:1.5;fill:none}

.mapwrap .et{fill:var(--muted)}
.mapwrap ul{margin:6px 0 0;padding-left:20px;font-size:16px}
table.tb{border-collapse:collapse;width:100%;font-size:16px}
.tblwrap{overflow-wrap:anywhere}
.rv ul{margin:6px 0 0;padding-left:20px}
.rv .due{color:var(--r-warn);font-weight:700}

.sim .big{font-size:26px;font-weight:700;line-height:1.3}
.sim table{border-collapse:collapse;width:100%;font-size:15px;margin-top:6px}

.sim svg{width:100%;max-width:560px;height:auto;display:block}

.sim .tr{fill:none;stroke:var(--muted);stroke-width:1.5}

.sim .tk{stroke:var(--text);stroke-width:3}
.sim .cur{stroke:var(--text);stroke-width:2;stroke-dasharray:5 4}
.sim .lim{margin-top:16px;font-size:16px;max-width:68ch}
.sim .nb{font-size:15px;color:var(--muted);margin-top:8px}
.sim .stage{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;max-width:780px}
.sim .cap{min-height:3.4em;font-weight:600;max-width:68ch;margin:8px 0}
.sim .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}

.sim .stage svg{max-width:760px}
.src ol{padding-left:22px}
.src li{margin:6px 0;overflow-wrap:anywhere}
@media (max-width:900px){

}
</style>

    else extra+='<details><summary>Bạn tự làm: '+st.text+'</summary><p><b>Đáp:</b> '+st.dap+'</p></details>';
  });
  s.innerHTML=h+(ol?'<ol>'+ol+'</ol>':'')+extra; box.appendChild(s);
}
function stepTgt(it,box){
  var s=el('section','hook'), id='tg'+Math.random().toString(36).slice(2,7);
  s.innerHTML=tagEl('t-check','Tự giải thích')+'<p><b>'+it.q+'</b></p><label class="lab" for="'+id+'">Viết câu trả lời của bạn bằng lời của mình (không bắt buộc, không lưu lên mạng)</label><textarea id="'+id+'"></textarea>'+
    '<details><summary>Xem đáp án để so</summary><p>'+it.dap+'</p></details>'; box.appendChild(s);
}
function recordQuiz(qid,qi,ok){
  var q=S.quiz[qid]||(S.quiz[qid]={res:{}}); q.res[qi]=ok?1:0; if(!S.first) S.first=Date.now(); save();
}
function stepQuiz(it,box){
  var s=el('section','quiz'), qid=it.id; s.innerHTML=tagEl('t-check','Tự kiểm tra');
  var score=el('div','score'); score.setAttribute('role','status');
  function upd(){ var r=(S.quiz[qid]||{}).res||{}, ks=Object.keys(r), tn=it.qs.filter(function(q){return q.loai==='trac-nghiem'&&q.ans>=0}).length; if(ks.length) score.textContent='Đúng '+ks.filter(function(k){return r[k]}).length+'/'+ks.length+' câu đã làm (tổng '+tn+' câu trắc nghiệm).'; }
  it.qs.forEach(function(q,qi){
    var d=el('div','q'); d.innerHTML='<p><b>Câu '+(qi+1)+'. '+q.q+'</b></p>';
    if(q.loai==='tu-luan'||!q.opts.length){
      var id='tl'+qid+'_'+qi; d.innerHTML+='<label class="lab" for="'+id+'">Tự viết câu trả lời</label><textarea id="'+id+'"></textarea><details><summary>Xem câu trả lời mẫu</summary><p>'+(q.mau||q.expl||'')+'</p></details>';
    } else {
      var fb=el('div','fb'); fb.setAttribute('role','status'); fb.hidden=true; var btns=[];
      q.opts.forEach(function(o,oi){
        var b=el('button','opt','<b>'+'ABCDEF'.charAt(oi)+'.</b> '+o); b.type='button'; btns.push(b);
        b.addEventListener('click',function(){
          btns.forEach(function(x){x.classList.remove('ok','no')});
          var ok=oi===q.ans; if(q.ans>=0){ b.classList.add(ok?'ok':'no'); if(!ok) btns[q.ans].classList.add('ok'); recordQuiz(qid,qi,ok); upd(); }
          fb.hidden=false; fb.className='fb '+(q.ans<0?'':ok?'ok':'no');
          fb.innerHTML=(q.ans<0?'':ok?'<b>Đúng.</b> ':'<b>Chưa đúng.</b> Đáp án là '+'ABCDEF'.charAt(q.ans)+'. ')+(q.expl||'');
        });
        d.appendChild(b);
      });
      d.appendChild(fb);
    }
    s.appendChild(d);
  });
  s.appendChild(score); upd(); box.appendChild(s);
}
function stepTom(items,box){
  var s=el('section','tom'); s.innerHTML=tagEl('t-def','Chương này, bạn nhớ')+'<ul>'+items.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'; box.appendChild(s);
}
function renderStep(st,box){
  if(st.t==='hoi') stepHoi(st.it,box); else if(st.t==='idea') stepIdea(st.b,box); else if(st.t==='tom') stepTom(st.items,box);
  else if(st.it.k==='vi-du-giai') stepVd(st.it,box); else if(st.it.k==='tu-giai-thich') stepTgt(st.it,box); else if(st.it.k==='quiz') stepQuiz(st.it,box);
}
function stepLabel(r){
  var st=STEPS[r.c][r.s], ni=CH[r.c].blocks.length;
  if(st.t==='idea') return 'Ý <b>'+(st.i+1)+'/'+ni+'</b>'; if(st.t==='hoi') return 'Mở đầu'; if(st.t==='tom') return 'Tóm tắt'; return 'Luyện tập';
}

/* ---------- các trang ---------- */
function viewCover(box){
  var h=el('h1',null,D.title); h.tabIndex=-1; box.appendChild(h);
  box.appendChild(el('p','sub',V.cover.meta.filter(function(m){return !/^B(ả|a)n$/i.test(strip(m[0]))}).map(function(m){return strip(m[0])+' '+m[1]}).join(' · ')));
  if(V.cover.cauHoi) box.appendChild(el('section','hook',tagEl('t-check','Câu hỏi thật')+'<p><b>'+V.cover.cauHoi+'</b></p>'));
  if(V.cover.mucTieu.length) box.appendChild(el('section','hook',tagEl('t-def','Sau bài này bạn tự làm được')+'<ol>'+V.cover.mucTieu.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>'));
  if(V.nhoLai.length){
    var s=el('section','hook',tagEl('t-check','Nhớ lại')+'<p>Tự trả lời trước, rồi mở đáp án để so. Các câu lấy từ bài trước.</p>');
    V.nhoLai.forEach(function(q,i){ var d=el('div','qa'); d.innerHTML='<p><b>'+(i+1)+'. '+q.q+'</b> '+(q.tu?'<small>(từ '+q.tu+')</small>':'')+'</p><details><summary>Xem đáp án</summary><p>'+q.dap+'</p></details>'; s.appendChild(d); });
    box.appendChild(s);
  }
  var row=el('div','btnrow'), b=btn(NC?'Bắt đầu Chương 1 →':'Đến phần ôn rải →','pri'); b.addEventListener('click',function(){go(nextOf({v:'cover'}))}); row.appendChild(el('span')); row.appendChild(b); box.appendChild(row);
}
function dayStart(t){var d=new Date(t); d.setHours(0,0,0,0); return d.getTime()}
function fmtD(t){var d=new Date(t); return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)}
function viewRev(box){
  var h=el('h1',null,'Ôn rải'); h.tabIndex=-1; box.appendChild(h);
  box.appendChild(el('p','sub','Ôn lại sau 1, 3, 7 và 21 ngày giúp nhớ lâu hơn một lần đọc dài. Tự trả lời trước khi mở đáp án.'));
  var rv=el('section','hook rv'); box.appendChild(rv);
  function sched(){
    var days=V.onRai.lich, html=tagEl('t-check','Lịch ôn');
    if(!S.first){ rv.innerHTML=html+'<p>Làm một câu trắc nghiệm trong bài, hoặc bấm nút dưới đây, để bắt đầu tính lịch.</p>'; var b=btn('Bắt đầu tính lịch từ hôm nay','pri'); b.addEventListener('click',function(){S.first=Date.now();save();sched()}); rv.appendChild(b); return; }
    var now=Date.now(), base=dayStart(S.first); html+='<ul>';
    days.forEach(function(d){ var due=base+d*86400000, dn=S.done[d]; html+='<li>Sau '+d+' ngày ('+fmtD(due)+'): '+(dn?'<span class="okd">✓ đã ôn</span>':(now>=due?'<span class="due">⚠ đến hạn, ôn hôm nay</span> <button type="button" data-d="'+d+'">Đánh dấu đã ôn</button>':'còn '+Math.ceil((due-now)/86400000)+' ngày'))+'</li>'; });
    html+='</ul>';
    var wr=[]; CH.forEach(function(c){ c.extras.forEach(function(e){ if(e.k!=='quiz') return; var r=(S.quiz[e.id]||{}).res||{}; var bad=Object.keys(r).filter(function(k){return !r[k]}).map(function(k){return +k+1}); if(bad.length) wr.push('Chương '+c.n+': câu '+bad.join(', ')); }); });
    if(wr.length) html+='<p><b>Cần ôn lại (câu làm sai):</b></p><ul><li>'+wr.join('</li><li>')+'</li></ul>';
    rv.innerHTML=html; $$('button[data-d]',rv).forEach(function(b){ b.addEventListener('click',function(){ S.done[b.getAttribute('data-d')]=Date.now(); save(); sched(); }); });
  }
  sched();
  if(V.onRai.qs.length){ box.appendChild(el('h2','sec','Câu ôn rải')); V.onRai.qs.forEach(function(q,i){ var d=el('div','qa'); d.innerHTML='<p><b>'+(i+1)+'. '+q.q+'</b> '+(q.tu?'<small>(từ '+q.tu+')</small>':'')+'</p><details><summary>Xem đáp án</summary><p>'+q.dap+'</p></details>'; box.appendChild(d); }); }
}
function tableHtml(t){ return '<table class="tb"><thead><tr>'+t.head.map(function(c){return '<th scope="col">'+c+'</th>'}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'; }
function viewEnd(box){
  var h=el('h1',null,'Từ điển, nguồn và điểm cần kiểm tra'); h.tabIndex=-1; box.appendChild(h);
  if(D.glossary){ box.appendChild(el('h2','sec','Từ điển thuật ngữ')); box.appendChild(el('div','tblwrap',tableHtml(D.glossary))); }
  if(D.sources&&D.sources.length) box.appendChild(el('div','src',''+'<h2 class="sec">Nguồn tham khảo</h2><ol>'+D.sources.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>'+(D.sourcesNote||[]).map(function(x){return '<p>'+x+'</p>'}).join('')));
  if(D.checks&&D.checks.length) box.appendChild(el('div','src','<h2 class="sec">Cần kiểm tra lại</h2><ol>'+D.checks.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>'+(D.checksNote||[]).map(function(x){return '<p>'+x+'</p>'}).join('')));
  if(D.dossier){ box.appendChild(el('h2','sec','Đối chiếu')); box.appendChild(el('div','tblwrap',tableHtml(D.dossier))); }
  box.appendChild(el('p','sub','Bản dựng '+escH(D.built||'')+'.'));
}

/* ---------- vẽ trang ---------- */
var view=$('#view'), crumb=$('#crumb'), prog=$('#prog');
function tocHtml(r){
  var items=[{r:{v:'cover'},t:'Mở đầu',s:'Câu hỏi, mục tiêu, nhớ lại'}];
  CH.forEach(function(c,i){ items.push({r:{v:'ch',c:i,s:0},t:c.n+'. '+c.plain,s:c.blocks.length+' ý · luyện tập · '+minutes(i)+' phút',ci:i}); });
  items.push({r:{v:'rev'},t:'Ôn rải',s:'Lịch 1 · 3 · 7 · 21 ngày'}); items.push({r:{v:'end'},t:'Từ điển · nguồn',s:''});
  return items.map(function(it){
    var now=it.r.v===r.v&&(r.v!=='ch'||it.r.c===r.c), done=it.ci!=null&&STEPS[it.ci].every(function(_,j){return S.seen['c'+it.ci+':'+j]});
    return '<li><a href="'+href(it.r)+'" class="'+(now?'now':done?'done':'')+'"'+(now?' aria-current="step"':'')+'>'+escH(it.t)+(it.s?'<small>'+escH(it.s)+'</small>':'')+(done&&!now?'<span class="sr"> (đã xem)</span>':'')+'</a></li>';
  }).join('');
}
function render(){
  var r=route(), box=view; closeTu(false); box.innerHTML=''; mapHosts=[];
  $('#tocT').textContent=strip(D.topic||D.title);
  if(r.v==='ch'){
    var c=r.c, st=STEPS[c]; $('#mY').setAttribute('aria-pressed',String(S.mode==='y')); $('#mC').setAttribute('aria-pressed',String(S.mode==='c'));
    if(S.mode==='y'){
      S.seen['c'+c+':'+r.s]=1; var h=el('h1',null,escH('Chương '+CH[c].n+'. ')+CH[c].title); h.tabIndex=-1; box.appendChild(h); box.appendChild(el('div','sub',''));
      renderStep(st[r.s],box);
      crumb.innerHTML='Chương <b>'+(c+1)+'/'+NC+'</b> · '+stepLabel(r)+' · khoảng '+minutes(c)+' phút';
    } else {
      st.forEach(function(_,j){S.seen['c'+c+':'+j]=1}); var h2=el('h1',null,escH('Chương '+CH[c].n+'. ')+CH[c].title); h2.tabIndex=-1; box.appendChild(h2); box.appendChild(el('div','sub',''));
      st.forEach(function(s){ renderStep(s,box); });
      crumb.innerHTML='Chương <b>'+(c+1)+'/'+NC+'</b> · cả chương · khoảng '+minutes(c)+' phút';
    }
  } else {
    $('#mY').setAttribute('aria-pressed','true'); $('#mC').setAttribute('aria-pressed','false'); $('#mY').hidden=$('#mC').hidden=true;
    (r.v==='cover'?viewCover:r.v==='rev'?viewRev:viewEnd)(box);
    crumb.innerHTML=r.v==='cover'?'<b>Mở đầu</b>':r.v==='rev'?'<b>Ôn rải</b>':'<b>Từ điển · nguồn</b>';
    S.seen[r.v]=1;
  }
  if(r.v==='ch') $('#mY').hidden=$('#mC').hidden=false;
  if(r.v!=='cover'||true){ /* nút điều hướng */
    var nx=nextOf(r), pv=prevOf(r);
    if(r.v==='ch'||r.v==='rev'||r.v==='end'){
      var row=el('div','btnrow'), full=S.mode==='c'&&r.v==='ch';
      var nr=full?(r.c<NC-1?{v:'ch',c:r.c+1,s:0}:{v:'rev'}):nx, pr=full?(r.c>0?{v:'ch',c:r.c-1,s:0}:{v:'cover'}):pv;
      function lab(t,fwd){ if(!t) return ''; if(t.v==='ch'&&r.v==='ch'&&t.c===r.c) return fwd?'Ý tiếp theo →':'← Ý trước'; if(t.v==='ch') return fwd?'Chương '+(t.c+1)+' →':'← Chương '+(t.c+1); return t.v==='cover'?'← Mở đầu':t.v==='rev'?(fwd?'Ôn rải →':'← Ôn rải'):(fwd?'Từ điển và nguồn →':'← Từ điển'); }
      if(pr){ var pb=btn(lab(pr,false)); pb.addEventListener('click',function(){go(pr)}); row.appendChild(pb); } else row.appendChild(el('span'));
      if(nr){ var nb=btn(lab(nr,true),'pri'); nb.addEventListener('click',function(){go(nr)}); row.appendChild(nb); }
      box.appendChild(row);
    }
  }
  $('#tocL').innerHTML=tocHtml(r);
  var cur=$('#tocL a.now'); if(cur&&cur.scrollIntoView&&window.innerWidth<=900){ try{cur.scrollIntoView({block:'nearest',inline:'center'})}catch(e){} }
  var n=Object.keys(S.seen).length, pc=Math.min(100,Math.round(n*100/TOTAL)); prog.setAttribute('aria-valuenow',String(pc)); $('i',prog).style.width=pc+'%';
  save();
  var hd=$('h1',box); if(hd&&render.focusNext){ hd.focus({preventScroll:true}); window.scrollTo(0,0); }
  render.focusNext=false;
}
render.focusNext=false;
$('#mY').addEventListener('click',function(){S.mode='y';save();render()});
$('#mC').addEventListener('click',function(){S.mode='c';save();render()});
window.addEventListener('hashchange',function(){render.focusNext=true;render()});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey) return; var t=e.target&&e.target.tagName; if(/INPUT|TEXTAREA|SELECT/.test(t||'')) return;
  var r=route(); if(r.v!=='ch'||S.mode!=='y') return;
  if(e.key==='ArrowRight'){ var n=nextOf(r); if(n) go(n); } else if(e.key==='ArrowLeft'){ var p=prevOf(r); if(p) go(p); }
});
if(D.taiVe){ var hm=$('#home'); hm.hidden=false; }
render.focusNext=false; render();
})();
</script>
</body>
