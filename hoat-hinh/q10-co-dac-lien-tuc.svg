<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Cô đặc liên tục dưới áp suất khí quyển (sơ đồ khối)</title><desc>Sơ đồ khối theo chú thích 1–7 của slide: thùng chứa dịch 1, bơm 2, gia nhiệt dạng tấm bản 3, thiết bị đun nóng 4, thiết bị bốc hơi 5, thiết bị chưng cất 6, thiết bị ngưng tụ 7; thứ tự nối theo số là suy luận.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="10" y="34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Cô đặc liên tục (khí quyển)</text><rect class="bt" x="15" y="70" width="150" height="80" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="90.0" y="106.0" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">1 Thùng chứa</text><text class="bt" x="90.0" y="130.0" font-size="18" text-anchor="middle" fill="currentColor">dịch cần cô</text><line class="bt" x1="165" y1="110" x2="182.0" y2="110.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="195,110 182.0,118.0 182.0,102.0" fill="currentColor"/><rect class="bt" x="195" y="70" width="150" height="80" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="270.0" y="116.0" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">2 Bơm</text><line class="bt" x1="345" y1="110" x2="362.0" y2="110.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="375,110 362.0,118.0 362.0,102.0" fill="currentColor"/><rect class="bt" x="375" y="70" width="150" height="80" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="450.0" y="106.0" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">3 Gia nhiệt</text><text class="bt" x="450.0" y="130.0" font-size="18" text-anchor="middle" fill="currentColor">dạng tấm bản</text></g><g data-buoc="2"><line class="bt" x1="450" y1="150" x2="450.0" y2="217.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="450,230 442.0,217.0 458.0,217.0" fill="currentColor"/><rect class="bt" x="375" y="230" width="150" height="80" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="450.0" y="266.0" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">4 Thiết bị</text><text class="bt" x="450.0" y="290.0" font-size="18" text-anchor="middle" fill="currentColor">đun nóng</text></g><g data-buoc="3"><line class="bt" x1="375" y1="270" x2="358.0" y2="270.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="345,270 358.0,262.0 358.0,278.0" fill="currentColor"/><rect class="bt" x="195" y="230" width="150" height="80" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="270.0" y="266.0" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">5 Thiết bị</text><text class="bt" x="270.0" y="290.0" font-size="18" text-anchor="middle" fill="currentColor">bốc hơi</text><line class="bt" x1="270" y1="230" x2="270.0" y2="173.0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><polygon class="bt" points="270,160 278.0,173.0 262.0,173.0" fill="currentColor"/><text class="bt" x="282" y="200" font-size="18" text-anchor="start" fill="currentColor">hơi bay ra</text></g><g data-buoc="4"><line class="bt" x1="195" y1="270" x2="178.0" y2="270.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="165,270 178.0,262.0 178.0,278.0" fill="currentColor"/><rect class="bt" x="15" y="230" width="150" height="80" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="90.0" y="266.0" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">6 Chưng cất</text><text class="bt" x="90.0" y="290.0" font-size="18" text-anchor="middle" fill="currentColor">(?)</text><line class="bt" x1="90" y1="310" x2="90.0" y2="377.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="90,390 82.0,377.0 98.0,377.0" fill="currentColor"/><rect class="bt" x="15" y="390" width="150" height="80" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="90.0" y="426.0" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">7 Thiết bị</text><text class="bt" x="90.0" y="450.0" font-size="18" text-anchor="middle" fill="currentColor">ngưng tụ</text></g><g data-buoc="5"><line class="bt" x1="270" y1="310" x2="270.0" y2="347.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="270,360 262.0,347.0 278.0,347.0" fill="currentColor"/><text class="bt" x="345" y="392" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">dịch đặc ra (?)</text><text class="bt" x="270" y="522" font-size="18" text-anchor="middle" fill="currentColor">Nối theo thứ tự số; chưa xác nhận bằng ảnh</text></g></svg>