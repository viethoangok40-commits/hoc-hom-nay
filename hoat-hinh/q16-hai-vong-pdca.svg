<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 598" role="img" width="540" height="598"><title>Hai vòng PDCA trong ISO 22000:2018</title><desc>Vòng ngoài của tổ chức: Plan là điều 4 đến 7, Do là điều 8, Check là điều 9, Act là điều 10. Vòng trong nằm trong điều 8: Plan gồm PRP, truy xuất, ứng phó khẩn cấp, phân tích mối nguy, xác nhận giá trị sử dụng, kế hoạch kiểm soát mối nguy và hoạch định thẩm tra; Do là thực hiện kế hoạch, kiểm soát theo dõi đo lường và sự không phù hợp; Check là thẩm tra và phân tích kết quả; Act là cập nhật PRP và kế hoạch.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="38" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Hai vòng PDCA lồng nhau</text><g data-buoc="1"><line x1="8" y1="74" x2="8" y2="152" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="92" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · Vòng tổ chức: Plan</text><text x="24" y="118" font-size="18" text-anchor="start" class="bt" fill="currentColor">Điều 4 bối cảnh · 5 lãnh đạo</text><text x="24" y="144" font-size="18" text-anchor="start" class="bt" fill="currentColor">Điều 6 hoạch định · 7 hỗ trợ</text></g><g data-buoc="2"><line x1="8" y1="170" x2="8" y2="274" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="188" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · Vòng tổ chức: Do, Check, Act</text><text x="24" y="214" font-size="18" text-anchor="start" class="bt" fill="currentColor">Do = điều 8 vận hành</text><text x="24" y="240" font-size="18" text-anchor="start" class="bt" fill="currentColor">Check = điều 9 đánh giá kết quả</text><text x="24" y="266" font-size="18" text-anchor="start" class="bt" fill="currentColor">Act = điều 10 cải tiến</text></g><g data-buoc="3"><line x1="8" y1="292" x2="8" y2="422" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="310" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · Vòng vận hành (trong điều 8): Plan</text><text x="24" y="336" font-size="18" text-anchor="start" class="bt" fill="currentColor">PRP, truy xuất, ứng phó khẩn cấp</text><text x="24" y="362" font-size="18" text-anchor="start" class="bt" fill="currentColor">Phân tích mối nguy, validation</text><text x="24" y="388" font-size="18" text-anchor="start" class="bt" fill="currentColor">Kế hoạch kiểm soát mối nguy</text><text x="24" y="414" font-size="18" text-anchor="start" class="bt" fill="currentColor">Hoạch định thẩm tra</text></g><g data-buoc="4"><line x1="8" y1="440" x2="8" y2="570" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="458" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">4 · Vòng vận hành: Do, Check, Act</text><text x="24" y="484" font-size="18" text-anchor="start" class="bt" fill="currentColor">Do: thực hiện kế hoạch, kiểm soát</text><text x="24" y="510" font-size="18" text-anchor="start" class="bt" fill="currentColor">theo dõi đo lường và sự không phù hợp</text><text x="24" y="536" font-size="18" text-anchor="start" class="bt" fill="currentColor">Check: thẩm tra, phân tích kết quả</text><text x="24" y="562" font-size="18" text-anchor="start" class="bt" fill="currentColor">Act: cập nhật PRP và kế hoạch</text></g></svg>