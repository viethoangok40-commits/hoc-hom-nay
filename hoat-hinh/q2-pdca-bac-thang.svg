<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Vòng PDCA lặp lại để nâng chuẩn lên từng bậc</title><desc>Bậc thang ba mức: hiện trạng, chuẩn quốc gia, chuẩn quốc tế. Trên mỗi bậc là một vòng P D C A; kết quả được tiêu chuẩn hóa và giữ lại rồi vòng tiếp theo nâng lên bậc cao hơn.</desc><style>.pd{animation:pd 1.2s ease-in-out both}@keyframes pd{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.pd{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text x="10" y="38" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">PDCA lặp để lên bậc</text><line class="pd" x1="20" y1="440" x2="200" y2="440" stroke="currentColor" stroke-width="5"/><text x="110" y="472" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">Hiện trạng</text></g><g data-buoc="2"><g class="pd"><path d="M129.7,312.9 A42,42 0 0 1 147.1,330.3" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="149.9,335.6 138.1,328.3 150.4,321.7" fill="currentColor"/><path d="M147.1,369.7 A42,42 0 0 1 129.7,387.1" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="124.4,389.9 131.7,378.1 138.3,390.4" fill="currentColor"/><path d="M90.3,387.1 A42,42 0 0 1 72.9,369.7" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="70.1,364.4 81.9,371.7 69.6,378.3" fill="currentColor"/><path d="M72.9,330.3 A42,42 0 0 1 90.3,312.9" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="95.6,310.1 88.3,321.9 81.7,309.6" fill="currentColor"/><circle cx="110" cy="308" r="16" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3"/><text x="110" y="315" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">P</text><circle cx="152" cy="350" r="16" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3"/><text x="152" y="357" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">D</text><circle cx="110" cy="392" r="16" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3"/><text x="110" y="399" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">C</text><circle cx="68" cy="350" r="16" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3"/><text x="68" y="357" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">A</text></g><text x="110" y="272" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">P → D → C → A</text></g><g data-buoc="3"><line class="pd" x1="200" y1="440" x2="200" y2="330" stroke="currentColor" stroke-width="5"/><line class="pd" x1="200" y1="330" x2="360" y2="330" stroke="currentColor" stroke-width="5"/><text x="215" y="362" font-size="20" font-weight="700" text-anchor="start" fill="currentColor">Chuẩn quốc gia</text><text x="215" y="388" font-size="18" text-anchor="start" fill="currentColor">tiêu chuẩn mới được giữ lại</text></g><g data-buoc="4"><g class="pd"><path d="M299.7,224.9 A42,42 0 0 1 317.1,242.3" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="319.9,247.6 308.1,240.3 320.4,233.7" fill="currentColor"/><path d="M317.1,281.7 A42,42 0 0 1 299.7,299.1" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="294.4,301.9 301.7,290.1 308.3,302.4" fill="currentColor"/><path d="M260.3,299.1 A42,42 0 0 1 242.9,281.7" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="240.1,276.4 251.9,283.7 239.6,290.3" fill="currentColor"/><path d="M242.9,242.3 A42,42 0 0 1 260.3,224.9" fill="none" stroke="currentColor" stroke-width="3"/><polygon points="265.6,222.1 258.3,233.9 251.7,221.6" fill="currentColor"/><circle cx="280" cy="220" r="16" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3"/><text x="280" y="227" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">P</text><circle cx="322" cy="262" r="16" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3"/><text x="322" y="269" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">D</text><circle cx="280" cy="304" r="16" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3"/><text x="280" y="311" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">C</text><circle cx="238" cy="262" r="16" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3"/><text x="238" y="269" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">A</text></g><line class="pd" x1="360" y1="330" x2="360" y2="220" stroke="currentColor" stroke-width="5"/><line class="pd" x1="360" y1="220" x2="530" y2="220" stroke="currentColor" stroke-width="5"/><text x="368" y="250" font-size="20" font-weight="700" text-anchor="start" fill="currentColor">Chuẩn quốc tế</text><text x="368" y="276" font-size="18" text-anchor="start" fill="currentColor">PDCA lặp tiếp</text></g></svg>