<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Vỏ hydrat hóa quanh ion Na+ và Cl- khi muối tan</title><desc>Bốn khung: tinh thể NaCl rơi vào nước; Na+ và Cl- tách ra; phân tử nước quay đầu oxy mang điện âm từng phần về phía Na+; phân tử nước quay đầu hydro mang điện dương từng phần về phía Cl-. Hình vẽ bốn phân tử mỗi ion để minh họa, thực tế khoảng sáu.</desc><style>.vh-w{animation:vh-w 1.1s ease-out both}@keyframes vh-w{from{opacity:.1}to{opacity:1}}@media (prefers-reduced-motion:reduce){.vh-w{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><g transform="translate(5,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">1 · Tinh thể</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">NaCl rơi vào nước</text><circle cx="90" cy="70" r="19" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="3"/><text x="90" y="77" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">+</text><circle cx="136" cy="70" r="19" fill="none" stroke="currentColor" stroke-width="3"/><text x="136" y="77" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">−</text><circle cx="90" cy="116" r="19" fill="none" stroke="currentColor" stroke-width="3"/><text x="90" y="123" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">−</text><circle cx="136" cy="116" r="19" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="3"/><text x="136" y="123" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">+</text><text x="125" y="185" font-size="19" text-anchor="middle" fill="currentColor">tinh thể NaCl vào nước</text></g></g><g data-buoc="2"><g transform="translate(285,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">2 · Ion tách ra</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">nước phân ly muối</text><circle cx="60" cy="90" r="19" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="3"/><text x="60" y="97" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">+</text><circle cx="190" cy="90" r="19" fill="none" stroke="currentColor" stroke-width="3"/><text x="190" y="97" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">−</text><path d="M95,90 H160" stroke="currentColor" stroke-width="3"/><path d="M95,90 l10,-6 v12 z M160,90 l-10,-6 v12 z" fill="currentColor"/><text x="125" y="160" font-size="19" text-anchor="middle" fill="currentColor">Na⁺ và Cl⁻ tách ra</text></g></g><g data-buoc="3"><g transform="translate(5,300)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">3 · Quanh Na⁺</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">đầu O (δ−) hướng vào</text><circle cx="110" cy="95" r="19" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="3"/><text x="110" y="102" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">+</text><g transform="translate(154,139) rotate(-45)" class="vh-w"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><g transform="translate(66,139) rotate(45)" class="vh-w"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><g transform="translate(66,51) rotate(-225)" class="vh-w"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><g transform="translate(154,51) rotate(-135)" class="vh-w"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><text x="110" y="200" font-size="19" text-anchor="middle" fill="currentColor">O quay vào Na⁺</text></g></g><g data-buoc="4"><g transform="translate(285,300)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">4 · Quanh Cl⁻</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">đầu H (δ+) hướng vào</text><circle cx="110" cy="95" r="19" fill="none" stroke="currentColor" stroke-width="3"/><text x="110" y="102" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">−</text><g transform="translate(154,139) rotate(-225)" class="vh-w"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="1