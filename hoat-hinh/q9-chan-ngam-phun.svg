<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Chần bằng nước nóng: ngâm hay phun</title><desc>Hai bể cạnh nhau: bên trái nguyên liệu chìm hoàn toàn trong nước chần nóng (ngâm); bên phải nguyên liệu nằm trên lưới, nước chần nóng phun từ trên xuống bề mặt (phun). Ngâm tiếp xúc nhiều nước hơn nên thất thoát chất tan nhiều hơn.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="10" y="34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Chần bằng nước nóng (a) ngâm</text><path class="bt" d="M20 130 L20 330 L250 330 L250 130" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect class="bt" x="20" y="190" width="230" height="140" rx="2" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="0"/><line class="bt" x1="20" y1="190" x2="250" y2="190" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><circle class="bt" cx="70" cy="270" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="115" cy="290" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="165" cy="265" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="205" cy="295" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="95" cy="235" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="150" cy="225" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="215" cy="240" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><text class="bt" x="135" y="118" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">(a) Ngâm</text><text class="bt" x="135" y="362" font-size="18" text-anchor="middle" fill="currentColor">chìm trong nước</text><text class="bt" x="135" y="386" font-size="18" text-anchor="middle" fill="currentColor">chần</text></g><g data-buoc="2"><text class="bt" x="412" y="118" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">(b) Phun</text><path class="bt" d="M290 130 L290 330 L520 330 L520 130" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line class="bt" x1="300" y1="260" x2="510" y2="260" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle class="bt" cx="335" cy="244" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="385" cy="244" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="435" cy="244" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="485" cy="244" r="15" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><line class="bt" x1="335" y1="175" x2="335" y2="205" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="385" y1="175" x2="385" y2="205" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="435" y1="175" x2="435" y2="205" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="485" y1="175" x2="485" y2="205" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="329" y1="205" x2="335" y2="212" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="379" y1="205" x2="385" y2="212" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="429" y1="205" x2="435" y2="212" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="479" y1="205" x2="485" y2="212" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="300" y1="160" x2="510" y2="160" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><text class="bt" x="412" y="148" font-size="18" text-anchor="middle" fill="currentColor">ống phun nước chần</text><rect class="bt" x="290" y="310" width="230" height="20" rx="2" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="0"/><text class="bt" x="412" y="362" font-size="18" text-anchor="middle" fill="currentColor">nước chần chảy lại bể</text></g><g data-buoc="3"><text class="bt" x="270" y="430" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">Tiếp xúc nước càng nhiều</text><text class="bt" x="270" y="456" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">thì chất tan thất thoát càng nhiều</text><text class="bt" x="135" y="494" font-size="18" text-anchor="middle" fill="currentColor">Ngâm: nhiều nước</text><text class="bt" x="412" y="494" font-size="18" text-anchor="middle" fill="currentColor">Phun: ít nước hơn</text><text class="bt" x="270" y="524" font-size="18" text-anchor="middle" fill="currentColor">(so sánh theo ghi chú lớp, cần kiểm tra)</text></g></svg>