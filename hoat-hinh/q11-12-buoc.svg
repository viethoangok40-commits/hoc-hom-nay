<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" role="img" width="540" height="560"><title>Mười hai bước xây dựng HACCP</title><desc>Danh sách mười hai bước xây dựng hệ thống HACCP theo slide, hiện dần theo bốn nhóm: chuẩn bị bước 1 đến 5, phân tích mối nguy và CCP bước 6 và 7, giới hạn tới hạn và giám sát bước 8 và 9, khắc phục thẩm tra và hồ sơ bước 10 đến 12.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="38" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">12 bước xây dựng HACCP</text><g data-buoc="1"><line x1="8" y1="66" x2="8" y2="232" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="84" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Chuẩn bị (bước 1 đến 5)</text><text x="24" y="114" font-size="18" text-anchor="start" class="bt" fill="currentColor">1 · Thành lập nhóm HACCP</text><text x="24" y="142" font-size="18" text-anchor="start" class="bt" fill="currentColor">2 · Mô tả đặc tính sản phẩm</text><text x="24" y="170" font-size="18" text-anchor="start" class="bt" fill="currentColor">3 · Xác định mục đích sử dụng</text><text x="24" y="198" font-size="18" text-anchor="start" class="bt" fill="currentColor">4 · Xây dựng sơ đồ quy trình công nghệ</text><text x="24" y="226" font-size="18" text-anchor="start" class="bt" fill="currentColor">5 · Xác nhận sơ đồ tại dây chuyền</text></g><g data-buoc="2"><line x1="8" y1="244" x2="8" y2="326" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="262" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Phân tích (bước 6 và 7)</text><text x="24" y="292" font-size="18" text-anchor="start" class="bt" fill="currentColor">6 · Phân tích mối nguy, biện pháp kiểm soát</text><text x="24" y="320" font-size="18" text-anchor="start" class="bt" fill="currentColor">7 · Xác định các điểm kiểm soát tới hạn</text></g><g data-buoc="3"><line x1="8" y1="346" x2="8" y2="428" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="364" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Giới hạn và giám sát (bước 8 và 9)</text><text x="24" y="394" font-size="18" text-anchor="start" class="bt" fill="currentColor">8 · Giới hạn tới hạn cho từng CCP</text><text x="24" y="422" font-size="18" text-anchor="start" class="bt" fill="currentColor">9 · Hệ thống giám sát tại các CCP</text></g><g data-buoc="4"><line x1="8" y1="448" x2="8" y2="558" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="466" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Xử lý và hồ sơ (bước 10 đến 12)</text><text x="24" y="496" font-size="18" text-anchor="start" class="bt" fill="currentColor">10 · Hành động khắc phục khi sai lệch</text><text x="24" y="524" font-size="18" text-anchor="start" class="bt" fill="currentColor">11 · Quy trình thẩm tra hệ thống</text><text x="24" y="552" font-size="18" text-anchor="start" class="bt" fill="currentColor">12 · Tài liệu và lưu trữ hồ sơ</text></g></svg>