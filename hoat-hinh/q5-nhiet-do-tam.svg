<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Nhiệt độ tâm hộp tăng chậm hơn nhiệt độ tác nhân gia nhiệt</title><desc>Đồ thị định tính nhiệt độ theo thời gian qua ba giai đoạn gia nhiệt, giữ nhiệt, làm nguội: nhiệt độ tác nhân gia nhiệt tăng nhanh rồi giữ; bề mặt bao bì theo sau; tâm hộp tăng chậm hơn, thấp hơn nhiệt độ tác nhân và không hằng số, tăng rồi giảm.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="10" y="36" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Nhiệt độ theo thời gian (minh họa)</text><line class="bt" x1="60" y1="395" x2="60" y2="85" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="60" y1="395" x2="515" y2="395" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><text class="bt" x="68" y="80" font-size="18" text-anchor="start" fill="currentColor">Nhiệt độ</text><text class="bt" x="515" y="428" font-size="18" text-anchor="end" fill="currentColor">Thời gian</text><line class="bt" x1="150" y1="90" x2="150" y2="395" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line class="bt" x1="360" y1="90" x2="360" y2="395" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text class="bt" x="105" y="456" font-size="18" text-anchor="middle" fill="currentColor">Gia nhiệt</text><text class="bt" x="255" y="456" font-size="18" text-anchor="middle" fill="currentColor">Giữ nhiệt</text><text class="bt" x="440" y="456" font-size="18" text-anchor="middle" fill="currentColor">Làm nguội</text><polyline class="bt" points="60,385 120,135 360,135 420,385" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text class="bt" x="250" y="118" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">Tác nhân gia nhiệt (T)</text></g><g data-buoc="2"><polyline class="bt" points="60,385 135,190 230,152 360,150 440,380" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/><text class="bt" x="285" y="182" font-size="18" text-anchor="middle" fill="currentColor">Bề mặt, bao bì</text></g><g data-buoc="3"><polyline class="bt" points="60,385 160,360 250,290 340,220 365,210 450,280 510,355" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 6"/><text class="bt" x="300" y="354" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">Tâm hộp</text></g><g data-buoc="4"><circle class="bt" cx="365" cy="210" r="9" fill="currentColor"/><text class="bt" x="300" y="497" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">Tâm: tăng rồi giảm, không hằng số</text><text class="bt" x="300" y="526" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">nên theo dõi nhiệt độ tâm</text></g></svg>