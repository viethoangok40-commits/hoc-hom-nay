<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 450" role="img" width="540" height="450"><title>Hiệu ứng chai mực: lỗ có cổ hẹp và khoang rộng giữ nước lại khi giải hấp</title><desc>Năm khung xếp theo thứ tự. Khung 1: RH thấp, lỗ chỉ có màng nước mỏng. Khung 2: RH tăng đến mức trung bình, cổ hẹp đầy nước còn khoang rộng chứa khí. Khung 3: RH cao, cả khoang rộng đầy nước. Khung 4: RH giảm về mức trung bình, nhưng cổ hẹp giữ nên khoang rộng vẫn đầy nước, nhiều nước hơn khung 2 ở cùng RH. Khung 5: RH giảm rất thấp, nước thoát hết khỏi lỗ.</desc><style>
.cm-in{animation:cm-in 1.4s ease-in both}
.cm-out{animation:cm-out 1.4s ease-out both}
@keyframes cm-in{from{transform:translateY(0);opacity:1}to{transform:translateY(20px);opacity:.15}}
@keyframes cm-out{from{transform:translateY(0);opacity:.15}to{transform:translateY(-14px);opacity:1}}
@media (prefers-reduced-motion:reduce){.cm-in,.cm-out{animation-duration:.001ms;animation-delay:0s}}
</style><g data-buoc="1"><g transform="translate(5,50)"><text x="0" y="-32" font-size="22" font-weight="700" fill="currentColor">1 · RH thấp</text><text x="0" y="-8" font-size="18" fill="currentColor">khởi đầu</text><path d="M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-opacity=".4"/><path d="M0,0 H170 V150 H0 Z M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="currentColor" fill-opacity=".14" fill-rule="evenodd"/><path d="M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="none" stroke="currentColor" stroke-width="2"/><text x="85" y="98" font-size="20" text-anchor="middle" fill="currentColor">màng mỏng</text></g></g><g data-buoc="2"><g transform="translate(185,50)"><text x="0" y="-32" font-size="22" font-weight="700" fill="currentColor">2 · RH vừa</text><text x="0" y="-8" font-size="18" fill="currentColor">↑ hấp phụ</text><path d="M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-opacity=".4"/><path d="M75,0 V45 H95 V0 Z" fill="currentColor" fill-opacity=".38"/><path d="M0,0 H170 V150 H0 Z M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="currentColor" fill-opacity=".14" fill-rule="evenodd"/><path d="M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="none" stroke="currentColor" stroke-width="2"/><circle class="cm-in" cx="85" cy="-8" r="2.8" fill="currentColor" style="animation-delay:0s"/><circle class="cm-in" cx="89" cy="-8" r="2.8" fill="currentColor" style="animation-delay:0.35s"/><circle class="cm-in" cx="93" cy="-8" r="2.8" fill="currentColor" style="animation-delay:0.7s"/><text x="85" y="100" font-size="20" text-anchor="middle" fill="currentColor">khí</text><text x="99" y="24" font-size="17" fill="currentColor">cổ: nước</text></g></g><g data-buoc="3"><g transform="translate(365,50)"><text x="0" y="-32" font-size="22" font-weight="700" fill="currentColor">3 · RH cao</text><text x="0" y="-8" font-size="18" fill="currentColor">↑ hấp phụ</text><path d="M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-opacity=".4"/><path d="M25,55 Q25,45 35,45 H135 Q145,45 145,55 V125 Q145,135 135,135 H35 Q25,135 25,125 Z" fill="currentColor" fill-opacity=".38"/><path d="M75,0 V45 H95 V0 Z" fill="currentColor" fill-opacity=".38"/><path d="M0,0 H170 V150 H0 Z M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="currentColor" fill-opacity=".14" fill-rule="evenodd"/><path d="M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="none" stroke="currentColor" stroke-width="2"/><circle class="cm-in" cx="85" cy="-8" r="2.8" fill="currentColor" style="animation-delay:0s"/><circle class="cm-in" cx="89" cy="-8" r="2.8" fill="currentColor" style="animation-delay:0.35s"/><circle class="cm-in" cx="93" cy="-8" r="2.8" fill="currentColor" style="animation-delay:0.7s"/><text x="85" y="98" font-size="20" text-anchor="middle" fill="currentColor">nước</text></g></g><g data-buoc="4"><g transform="translate(5,290)"><text x="0" y="-32" font-size="22" font-weight="700" fill="currentColor">4 · RH vừa</text><text x="0" y="-8" font-size="18" fill="currentColor">↓ giải hấp</text><path d="M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-opacity=".4"/><path d="M25,55 Q25,45 35,45 H135 Q145,45 145,55 V125 Q145,135 135,135 H35 Q25,135 25,125 Z" fill="currentColor" fill-opacity=".38"/><path d="M75,0 V45 H95 V0 Z" fill="currentColor" fill-opacity=".38"/><path d="M0,0 H170 V150 H0 Z M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="currentColor" fill-opacity=".14" fill-rule="evenodd"/><path d="M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="none" stroke="currentColor" stroke-width="2"/><text x="85" y="98" font-size="20" text-anchor="middle" fill="currentColor">nước</text></g><g transform="translate(365,290)"><text x="0" y="-8" font-size="20" font-weight="700" fill="currentColor">So khung 2, 4</text><text x="0" y="24" font-size="19" fill="currentColor">Cùng RH vừa:</text><text x="0" y="50" font-size="19" fill="currentColor">khung 2: khí</text><text x="0" y="76" font-size="19" fill="currentColor">khung 4: nước</text><text x="0" y="108" font-size="19" font-weight="700" fill="currentColor">Đó là trễ.</text></g></g><g data-buoc="5"><g transform="translate(185,290)"><text x="0" y="-32" font-size="22" font-weight="700" fill="currentColor">5 · RH rất thấp</text><text x="0" y="-8" font-size="18" fill="currentColor">↓ giải hấp</text><path d="M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-opacity=".4"/><path d="M0,0 H170 V150 H0 Z M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="currentColor" fill-opacity=".14" fill-rule="evenodd"/><path d="M75,0 V45 H35 Q25,45 25,55 V125 Q25,135 35,135 H135 Q145,135 145,125 V55 Q145,45 135,45 H95 V0 Z" fill="none" stroke="currentColor" stroke-width="2"/><circle class="cm-out" cx="85" cy="14" r="2.8" fill="currentColor" style="animation-delay:0s"/><circle class="cm-out" cx="89" cy="14" r="2.8" fill="currentColor" style="animation-delay:0.35s"/><circle class="cm-out" cx="93" cy="14" r="2.8" fill="currentColor" style="animation-delay:0.7s"/><text x="85" y="98" font-size="20" text-anchor="middle" fill="currentColor">trống</text></g></g></svg>