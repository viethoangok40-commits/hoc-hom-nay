<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Quá trình trả lời WHAT, quy trình trả lời HOW</title><desc>Hàng trên: đầu vào đi qua quá trình (WHAT, chuỗi hoạt động) để thành đầu ra. Hàng dưới: quy trình hay thủ tục (HOW) là cách thức cụ thể thực hiện các hoạt động của quá trình.</desc><style>.qq{animation:qq 1.2s ease-in-out both}@keyframes qq{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.qq{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text x="10" y="38" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Quá trình và quy trình</text><rect class="qq" x="10" y="70" width="150" height="110" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="3"/><text x="85" y="118" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">ĐẦU VÀO</text><text x="85" y="148" font-size="18" text-anchor="middle" fill="currentColor">(inputs)</text></g><g data-buoc="2"><g class="qq"><line x1="160" y1="125" x2="180" y2="125" stroke="currentColor" stroke-width="4"/><polygon points="190,125 176,116 176,134" fill="currentColor"/></g><rect class="qq" x="190" y="70" width="160" height="110" rx="6" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="5"/><text x="270" y="106" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">QUÁ TRÌNH</text><text x="270" y="136" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">= WHAT?</text><text x="270" y="164" font-size="18" text-anchor="middle" fill="currentColor">chuỗi hoạt động</text></g><g data-buoc="3"><g class="qq"><line x1="350" y1="125" x2="370" y2="125" stroke="currentColor" stroke-width="4"/><polygon points="380,125 366,116 366,134" fill="currentColor"/></g><rect class="qq" x="380" y="70" width="150" height="110" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="3"/><text x="455" y="118" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">ĐẦU RA</text><text x="455" y="148" font-size="18" text-anchor="middle" fill="currentColor">(outputs)</text></g><g data-buoc="4"><g class="qq"><line x1="270" y1="180" x2="270" y2="270" stroke="currentColor" stroke-width="4"/><polygon points="270,280 261,266 279,266" fill="currentColor"/></g><text x="285" y="226" font-size="18" text-anchor="start" fill="currentColor">cách thực hiện</text><text x="285" y="248" font-size="18" text-anchor="start" fill="currentColor">các hoạt động</text><rect class="qq" x="40" y="284" width="460" height="200" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="5"/><text x="270" y="322" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">QUY TRÌNH / thủ tục</text><text x="270" y="352" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">= HOW?</text><text x="270" y="392" font-size="18" text-anchor="middle" fill="currentColor">cách thức cụ thể để tiến hành</text><text x="270" y="418" font-size="18" text-anchor="middle" fill="currentColor">một hoạt động hoặc quá trình</text><text x="270" y="458" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">Nguyên tắc 4 nói về QUÁ TRÌNH</text></g></svg>