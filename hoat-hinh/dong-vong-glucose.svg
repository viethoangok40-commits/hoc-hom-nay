ll="currentColor">1</text><circle cx="114" cy="150" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="114" y="156" font-size="18" text-anchor="middle" fill="currentColor">2</text><circle cx="56" cy="150" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="56" y="156" font-size="18" text-anchor="middle" fill="currentColor">3</text><circle cx="27" cy="100" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="27" y="106" font-size="18" text-anchor="middle" fill="currentColor">4</text><circle cx="56" cy="50" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="56" y="56" font-size="18" text-anchor="middle" fill="currentColor">5</text><circle cx="114" cy="50" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="114" y="56" font-size="18" text-anchor="middle" fill="currentColor">O</text><line x1="46.8" y1="39.5" x2="37.2" y2="28.5" stroke="currentColor" stroke-width="3"/><circle cx="28" cy="18" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="28" y="24" font-size="18" text-anchor="middle" fill="currentColor">6</text><line x1="152" y1="90" x2="160" y2="72" stroke="currentColor" stroke-width="3"/><line x1="152" y1="110" x2="160" y2="128" stroke="currentColor" stroke-width="3"/><text x="165" y="48" font-size="18" text-anchor="start" fill="currentColor">OH lên</text><text x="165" y="68" font-size="18" text-anchor="start" fill="currentColor">= β</text><text x="165" y="140" font-size="18" text-anchor="start" fill="currentColor">OH xuống</text><text x="165" y="160" font-size="18" text-anchor="start" fill="currentColor">= α</text><text x="0" y="184" font-size="18" text-anchor="start" fill="currentColor">hai dạng khác nhau</text><text x="0" y="208" font-size="18" text-anchor="start" fill="currentColor">ở carbon C1</text></g></g></svg>