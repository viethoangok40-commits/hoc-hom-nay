<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Glucose mạch hở đóng vòng khi OH ở C5 tấn công C1, tạo OH mới ở C1 hướng xuống (alpha) hoặc lên (beta)</title><desc>Bốn khung: glucose mạch hở có nhóm aldehyde ở C1 và nhóm OH ở C5; oxy của nhóm OH ở C5 tiến tới C1; vòng sáu cạnh gồm C1 đến C5 và oxy được đóng lại; nhóm OH mới ở C1 hướng xuống là alpha và hướng lên là beta.</desc><style>.hb-p{animation:hb-p 1.2s ease-in-out both}@keyframes hb-p{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.hb-p{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><g transform="translate(5,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">1 · Mạch hở</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">6 carbon đánh số 1 đến 6</text><line x1="34.0" y1="80.0" x2="51.0" y2="80.0" stroke="currentColor" stroke-width="3"/><line x1="79.0" y1="80.0" x2="96.0" y2="80.0" stroke="currentColor" stroke-width="3"/><line x1="124.0" y1="80.0" x2="141.0" y2="80.0" stroke="currentColor" stroke-width="3"/><line x1="169.0" y1="80.0" x2="186.0" y2="80.0" stroke="currentColor" stroke-width="3"/><line x1="214.0" y1="80.0" x2="231.0" y2="80.0" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="80" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="20" y="86" font-size="18" text-anchor="middle" fill="currentColor">1</text><circle cx="65" cy="80" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="86" font-size="18" text-anchor="middle" fill="currentColor">2</text><circle cx="110" cy="80" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="110" y="86" font-size="18" text-anchor="middle" fill="currentColor">3</text><circle cx="155" cy="80" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="155" y="86" font-size="18" text-anchor="middle" fill="currentColor">4</text><circle cx="200" cy="80" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="200" y="86" font-size="18" text-anchor="middle" fill="currentColor">5</text><circle cx="245" cy="80" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="245" y="86" font-size="18" text-anchor="middle" fill="currentColor">6</text><text x="20" y="125" font-size="18" text-anchor="middle" fill="currentColor">CHO</text><text x="200" y="125" font-size="18" text-anchor="middle" fill="currentColor">OH</text><text x="0" y="184" font-size="18" text-anchor="start" fill="currentColor">C1 là nhóm aldehyde,</text><text x="0" y="208" font-size="18" text-anchor="start" fill="currentColor">C5 mang nhóm OH</text></g></g><g data-buoc="2"><g transform="translate(285,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">2 · O tiến tới C1</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">nét đứt: liên kết sắp tạo</text><line x1="136.0" y1="112.1" x2="121.0" y2="137.9" stroke="currentColor" stroke-width="3"/><line x1="100.0" y1="150.0" x2="70.0" y2="150.0" stroke="currentColor" stroke-width="3"/><line x1="49.0" y1="137.9" x2="34.0" y2="112.1" stroke="currentColor" stroke-width="3"/><line x1="34.0" y1="87.9" x2="49.0" y2="62.1" stroke="currentColor" stroke-width="3"/><line x1="70.0" y1="50.0" x2="100.0" y2="50.0" stroke="currentColor" stroke-width="3"/><line x1="121.0" y1="62.1" x2="136.0" y2="87.9" stroke="currentColor" stroke-width="3" class="hb-p" stroke-dasharray="7 6"/><circle cx="143" cy="100" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="143" y="106" font-size="18" text-anchor="middle" fill="currentColor">1</text><circle cx="114" cy="150" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="114" y="156" font-size="18" text-anchor="middle" fill="currentColor">2</text><circle cx="56" cy="150" r="14" fill="none" stroke="currentColor" stroke-width="3"/><text x="56