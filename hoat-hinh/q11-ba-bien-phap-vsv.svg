<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" role="img" width="540" height="470"><title>Ba nhóm biện pháp phòng ngừa vi sinh vật</title><desc>Ba khối hiện lần lượt: không để nhiễm từ con người, không để vi sinh vật sinh sôi bằng vệ sinh nhà xưởng thiết bị dụng cụ, và diệt vi sinh vật bằng nhiệt nóng, nhiệt lạnh, bao gói chân không, hóa chất.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="38" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Ba nhóm biện pháp vi sinh</text><g data-buoc="1"><line x1="8" y1="74" x2="8" y2="206" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="92" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · Không để nhiễm (con người)</text><text x="24" y="122" font-size="18" text-anchor="start" class="bt" fill="currentColor">Mặc bảo hộ lao động đúng quy định</text><text x="24" y="148" font-size="18" text-anchor="start" class="bt" fill="currentColor">Cắt ngắn móng tay, vệ sinh tay</text><text x="24" y="174" font-size="18" text-anchor="start" class="bt" fill="currentColor">Không để vết thương hở trên tay</text><text x="24" y="200" font-size="18" text-anchor="start" class="bt" fill="currentColor">Không làm việc khi bệnh truyền nhiễm</text></g><g data-buoc="2"><line x1="8" y1="232" x2="8" y2="312" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="250" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · Không để sinh sôi (vệ sinh)</text><text x="24" y="280" font-size="18" text-anchor="start" class="bt" fill="currentColor">Vệ sinh nhà xưởng sạch sẽ</text><text x="24" y="306" font-size="18" text-anchor="start" class="bt" fill="currentColor">Vệ sinh thiết bị, dụng cụ sạch sẽ</text></g><g data-buoc="3"><line x1="8" y1="330" x2="8" y2="436" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="348" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · Diệt vi sinh vật</text><text x="24" y="378" font-size="18" text-anchor="start" class="bt" fill="currentColor">Nhiệt nóng, nhiệt lạnh</text><text x="24" y="404" font-size="18" text-anchor="start" class="bt" fill="currentColor">Bao gói chân không</text><text x="24" y="430" font-size="18" text-anchor="start" class="bt" fill="currentColor">Dùng hóa chất</text></g></svg>