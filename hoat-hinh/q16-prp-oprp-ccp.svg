<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 598" role="img" width="540" height="598"><title>PRP, OPRP và CCP khác nhau ở đâu</title><desc>Bốn bước so sánh ba loại biện pháp: PRP không gắn với mối nguy riêng và không có tiêu chí; OPRP gắn với mối nguy đáng kể và có tiêu chí hành động đo hoặc quan sát được; CCP gắn với mối nguy đáng kể và có giới hạn tới hạn đo được; khi mất kiểm soát, CCP xử lý sản phẩm theo cách định sẵn còn OPRP chủ yếu khắc phục quá trình và xét sản phẩm từng trường hợp.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="38" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Ba loại biện pháp kiểm soát</text><g data-buoc="1"><line x1="8" y1="74" x2="8" y2="178" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="92" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · PRP</text><text x="24" y="118" font-size="18" text-anchor="start" class="bt" fill="currentColor">Tạo môi trường vệ sinh chung</text><text x="24" y="144" font-size="18" text-anchor="start" class="bt" fill="currentColor">Không gắn với mối nguy riêng</text><text x="24" y="170" font-size="18" text-anchor="start" class="bt" fill="currentColor">Không có tiêu chí</text></g><g data-buoc="2"><line x1="8" y1="196" x2="8" y2="300" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="214" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · OPRP</text><text x="24" y="240" font-size="18" text-anchor="start" class="bt" fill="currentColor">Chọn ra từ phân tích mối nguy</text><text x="24" y="266" font-size="18" text-anchor="start" class="bt" fill="currentColor">Cho mối nguy đáng kể</text><text x="24" y="292" font-size="18" text-anchor="start" class="bt" fill="currentColor">Tiêu chí hành động: đo hoặc quan sát</text></g><g data-buoc="3"><line x1="8" y1="318" x2="8" y2="422" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="336" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · CCP</text><text x="24" y="362" font-size="18" text-anchor="start" class="bt" fill="currentColor">Chọn ra từ phân tích mối nguy</text><text x="24" y="388" font-size="18" text-anchor="start" class="bt" fill="currentColor">Cho mối nguy đáng kể</text><text x="24" y="414" font-size="18" text-anchor="start" class="bt" fill="currentColor">Giới hạn tới hạn: đo được</text></g><g data-buoc="4"><line x1="8" y1="440" x2="8" y2="570" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="458" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">4 · Khi mất kiểm soát</text><text x="24" y="484" font-size="18" text-anchor="start" class="bt" fill="currentColor">CCP: xử lý sản phẩm theo cách định sẵn</text><text x="24" y="510" font-size="18" text-anchor="start" class="bt" fill="currentColor">OPRP: khắc phục quá trình,</text><text x="24" y="536" font-size="18" text-anchor="start" class="bt" fill="currentColor">xét sản phẩm từng trường hợp</text><text x="24" y="562" font-size="18" text-anchor="start" class="bt" fill="currentColor">Cả hai đều ghi hồ sơ</text></g></svg>