<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Thiết bị chần tầng sôi (nguyên lý, sơ đồ rút gọn)</title><desc>Mặt cắt một buồng đứng có đáy phân phối: chất lưu nóng đi từ dưới lên qua đáy, nâng các miếng nguyên liệu lơ lửng và đảo trộn như đang sôi nên nguyên liệu nhận nhiệt đều.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="10" y="34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Chần tầng sôi</text><path class="bt" d="M110 80 L110 360 L350 360 L350 80" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line class="bt" x1="110" y1="330" x2="350" y2="330" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 6"/><circle class="bt" cx="138" cy="316" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="182" cy="316" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="226" cy="316" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="270" cy="316" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="314" cy="316" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><text class="bt" x="366" y="300" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">nguyên liệu</text><text class="bt" x="366" y="324" font-size="18" text-anchor="start" fill="currentColor">nằm trên đáy</text><text class="bt" x="366" y="352" font-size="18" text-anchor="start" fill="currentColor">đáy phân phối</text><text class="bt" x="366" y="376" font-size="18" text-anchor="start" fill="currentColor">(giả định)</text></g><g data-buoc="2"><line class="bt" x1="150" y1="470" x2="150.0" y2="355.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="150,342 158.0,355.0 142.0,355.0" fill="currentColor"/><line class="bt" x1="230" y1="470" x2="230.0" y2="355.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="230,342 238.0,355.0 222.0,355.0" fill="currentColor"/><line class="bt" x1="310" y1="470" x2="310.0" y2="355.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="310,342 318.0,355.0 302.0,355.0" fill="currentColor"/><text class="bt" x="230" y="500" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">chất lưu nóng thổi từ dưới lên</text><text class="bt" x="230" y="524" font-size="18" text-anchor="middle" fill="currentColor">(nước hay khí: slide chưa ghi)</text></g><g data-buoc="3"><circle class="bt" cx="140" cy="250" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="190" cy="200" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="250" cy="235" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="300" cy="180" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="170" cy="130" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="280" cy="115" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><line class="bt" x1="140" y1="230" x2="140" y2="214" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line class="bt" x1="250" y1="215" x2="250" y2="199" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line class="bt" x1="300" y1="160" x2="300" y2="144" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text class="bt" x="366" y="160" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">nguyên liệu</text><text class="bt" x="366" y="184" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">lơ lửng,</text><text class="bt" x="366" y="208" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">đảo trộn</text></g><g data-buoc="4"><text class="bt" x="366" y="250" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">nóng đều</text><text class="bt" x="366" y="274" font-size="18" text-anchor="start" fill="currentColor">mọi mặt</text></g></svg>