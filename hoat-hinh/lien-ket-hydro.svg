="100" x2="195" y2="155" stroke="currentColor" stroke-width="4" stroke-dasharray="7 6"/><text x="125" y="200" font-size="19" text-anchor="middle" fill="currentColor">tối đa 4 liên kết hydro</text></g></g></svg>