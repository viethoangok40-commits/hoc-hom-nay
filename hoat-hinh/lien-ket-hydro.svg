<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Liên kết hydro trong nước lỏng liên tục hình thành và đứt</title><desc>Bốn khung: hai phân tử nước nối bằng nét đứt liên kết hydro; phân tử trượt ra xa nên liên kết đứt; phân tử gặp phân tử khác và tạo liên kết hydro mới; mỗi phân tử có tối đa bốn liên kết hydro.</desc><style>.hb-p{animation:hb-p 1.2s ease-in-out both}@keyframes hb-p{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.hb-p{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><g transform="translate(5,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">1 · Hai phân tử</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">H (δ+) hút O (δ−)</text><g transform="translate(60,70) rotate(-30)"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><g transform="translate(170,110) rotate(20)"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><line class="hb-p" x1="80" y1="72" x2="170" y2="110" stroke="currentColor" stroke-width="4" stroke-dasharray="7 6"/><text x="120" y="170" font-size="19" text-anchor="middle" fill="currentColor">nét đứt: liên kết hydro</text></g></g><g data-buoc="2"><g transform="translate(285,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">2 · Trượt ra xa</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">liên kết hydro đứt</text><g transform="translate(60,70) rotate(-30)"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><g transform="translate(215,90) rotate(20)"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><text x="120" y="172" font-size="19" text-anchor="middle" fill="currentColor">phân tử trượt ra xa:</text><text x="120" y="194" font-size="19" text-anchor="middle" fill="currentColor">liên kết đứt</text></g></g><g data-buoc="3"><g transform="translate(5,300)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">3 · Gặp phân tử khác</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">liên kết hydro mới</text><g transform="translate(60,110) rotate(-20)"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><g transform="translate(170,80) rotate(30)"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><line class="hb-p" x1="150" y1="82" x2="60" y2="110" stroke="currentColor" stroke-width="4" stroke-dasharray="7 6"/><text x="120" y="175" font-size="19" text-anchor="middle" fill="currentColor">gặp phân tử khác:</text><text x="120" y="199" font-size="19" text-anchor="middle" fill="currentColor">liên kết mới hình thành</text></g></g><g data-buoc="4"><g transform="translate(285,300)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">4 · Mỗi phân tử</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">tối đa 4 liên kết</text><g transform="translate(125,100) rotate(0)"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="0" cy="0" r="11" fill="currentColor" fill-opacity=".55" stroke="currentColor" stroke-width="3"/></g><g transform="translate(55,65) rotate(0)"><line x1="0" y1="0" x2="-16" y2="12" stroke="currentColor" stroke-width="3"/><line x1="0" y1="0" x2="16" y2="12" stroke="currentColor" stroke-width="3"/><circle cx="-16" cy="12" r="6" fill="none" stroke="currentColor" stroke-width