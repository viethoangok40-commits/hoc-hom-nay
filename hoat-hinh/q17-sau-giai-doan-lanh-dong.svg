<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Sáu giai đoạn nhiệt độ tâm khi lạnh đông</title><desc>Đường nhiệt độ tại tâm nguyên liệu theo thời gian chia sáu đoạn AS (quá lạnh), SB (tăng lên điểm lạnh đông, đá bắt đầu hình thành), BC (điểm lạnh đông giảm dần, phần lớn đá tạo thành), CD (dịch quá bão hòa kết tinh, tăng tới điểm eutectic), DE (tiếp tục kết tinh, E là điểm kết thúc), EF (giảm tới nhiệt độ thiết bị). Hình định tính, không theo số đo.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="32" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Nhiệt độ tại tâm khi lạnh đông</text><line x1="60" y1="380" x2="60.0" y2="70.0" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="60.0,60.0 55.5,70.0 64.5,70.0" fill="currentColor" class="bt"/><line x1="60" y1="380" x2="510.0" y2="380.0" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="520.0,380.0 510.0,375.5 510.0,384.5" fill="currentColor" class="bt"/><text x="70" y="64" font-size="18" text-anchor="start" class="bt" fill="currentColor">nhiệt độ tâm</text><text x="520" y="372" font-size="18" text-anchor="end" class="bt" fill="currentColor">thời gian</text><g data-buoc="1"><circle cx="60" cy="104.8" r="6" fill="currentColor" class="bt"/><text x="68" y="96.8" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">A</text><line x1="60" y1="104.8" x2="121.6" y2="208.4" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><circle cx="121.6" cy="208.4" r="6" fill="currentColor" class="bt"/><text x="129.6" y="230.4" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">S</text><text x="10" y="416" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">AS · quá lạnh: dưới điểm đông, nước vẫn lỏng</text></g><g data-buoc="2"><line x1="121.6" y1="208.4" x2="143.6" y2="172.9" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><circle cx="143.6" cy="172.9" r="6" fill="currentColor" class="bt"/><text x="151.6" y="164.9" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">B</text><text x="10" y="438" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">SB · tăng lên điểm đông, đá bắt đầu hình thành</text></g><g data-buoc="3"><line x1="143.6" y1="172.9" x2="280.0" y2="193.6" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><circle cx="280.0" cy="193.6" r="6" fill="currentColor" class="bt"/><text x="288.0" y="215.6" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">C</text><text x="10" y="460" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">BC · điểm đông giảm dần, phần lớn đá tạo thành</text></g><g data-buoc="4"><line x1="280.0" y1="193.6" x2="306.4" y2="187.7" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><circle cx="306.4" cy="187.7" r="6" fill="currentColor" class="bt"/><text x="314.4" y="179.7" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">D</text><text x="10" y="482" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">CD · dịch quá bão hòa kết tinh, tới eutectic</text></g><g data-buoc="5"><line x1="306.4" y1="187.7" x2="376.8" y2="208.4" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><circle cx="376.8" cy="208.4" r="6" fill="currentColor" class="bt"/><text x="384.8" y="200.4" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">E</text><text x="10" y="504" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">DE · tiếp tục kết tinh, E là điểm kết thúc</text></g><g data-buoc="6"><line x1="376.8" y1="208.4" x2="500" y2="341.6" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><circle cx="500" cy="341.6" r="6" fill="currentColor" class="bt"/><text x="508" y="333.6" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">F</text><text x="10" y="526" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">EF · giảm tới nhiệt độ thiết bị lạnh đông</text></g></svg>