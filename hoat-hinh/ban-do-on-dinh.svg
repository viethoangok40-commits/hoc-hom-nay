<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Bản đồ ổn định định tính: tốc độ các loại phản ứng hỏng theo hoạt độ nước</title><desc>Một đồ thị với trục ngang là hoạt độ nước từ 0 đến 1, trục đứng là tốc độ phản ứng, chỉ vẽ xu hướng. Đường vi sinh vật phẳng ở aw thấp rồi tăng mạnh. Đường enzyme có hoạt tính thấp ngay ở aw thấp và tăng theo aw. Đường Maillard tăng, đạt đỉnh ở vùng ẩm trung bình rồi giảm ở aw cao. Đường oxy hóa lipid thấp quanh độ ẩm lớp đơn M0, tăng ở vùng ẩm trung bình và đạt cực đại.</desc><style>
.bd-in{animation:bd-in .9s ease-out both}
@keyframes bd-in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bd-in{animation-duration:.001ms;animation-delay:0s}}
</style><g data-buoc="1"><rect x="336" y="40" width="115" height="290" fill="currentColor" fill-opacity=".10"/><text x="393" y="62" font-size="17" text-anchor="middle" fill="currentColor">ẩm trung bình</text><path d="M60,40 V330 H520" fill="none" stroke="currentColor" stroke-width="3"/><path d="M152,40 V330" stroke="currentColor" stroke-width="2" stroke-dasharray="6 6"/><text x="158" y="58" font-size="19" fill="currentColor">M0</text><text x="60" y="356" font-size="19" text-anchor="middle" fill="currentColor">0</text><text x="290" y="356" font-size="19" text-anchor="middle" fill="currentColor">0,5</text><text x="520" y="356" font-size="19" text-anchor="middle" fill="currentColor">1</text><text x="290" y="384" font-size="20" text-anchor="middle" fill="currentColor">aw (hoạt độ nước)</text><text x="14" y="190" font-size="19" fill="currentColor" transform="rotate(-90 14 190)" text-anchor="middle">tốc độ phản ứng (định tính)</text></g><g data-buoc="2"><g class="bd-in"><path d="M60,320 H313 C400,320 440,150 520,50" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></g><path d="M60,404 H110" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="none" stroke-linecap="round"/><text x="124" y="410" font-size="19" fill="currentColor">vi sinh vật</text></g><g data-buoc="3"><g class="bd-in"><path d="M60,300 C200,295 320,250 520,120" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round"/></g><path d="M60,436 H110" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round"/><text x="124" y="442" font-size="19" fill="currentColor">enzyme</text></g><g data-buoc="4"><g class="bd-in"><path d="M120,320 C260,310 330,120 382,100 S470,200 520,290" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="14 7" stroke-linecap="round"/></g><circle cx="382" cy="100" r="7" fill="currentColor"/><text x="392" y="92" font-size="19" fill="currentColor">đỉnh</text><path d="M60,468 H110" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="14 7" stroke-linecap="round"/><text x="124" y="474" font-size="19" fill="currentColor">Maillard (có đỉnh)</text></g><g data-buoc="5"><g class="bd-in"><path d="M60,302 C110,318 152,322 190,315 C280,290 340,150 400,110 S480,150 520,210" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="14 5 3 5" stroke-linecap="round"/></g><path d="M60,500 H110" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="14 5 3 5" stroke-linecap="round"/><text x="124" y="506" font-size="19" fill="currentColor">oxy hóa lipid</text></g></svg>