<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Hạt tinh bột gặp nước và nhiệt: nước vào vùng vô định hình làm hạt trương, tinh thể bị phá và mất lưỡng chiết, amylose rỉ ra</title><desc>Bốn khung: hạt tinh bột nguyên có vùng tinh thể nét đậm xen vùng vô định hình nét mảnh; nước thấm vào vùng vô định hình và hạt trương lên; các nét đậm của tinh thể chuyển thành nét đứt mảnh khi xoắn kép tháo ra, hạt mất lưỡng chiết; amylose rỉ ra ngoài hạt nhưng chuỗi không bị cắt.</desc><style>.hb-p{animation:hb-p 1.2s ease-in-out both}@keyframes hb-p{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.hb-p{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><g transform="translate(5,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">1 · Hạt nguyên</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">bán tinh thể</text><circle cx="105" cy="85" r="62" fill="none" stroke="currentColor" stroke-width="3"/><line x1="127" y1="85" x2="141" y2="85" stroke="currentColor" stroke-width="7"/><line x1="121" y1="101" x2="130" y2="110" stroke="currentColor" stroke-width="7"/><line x1="105" y1="107" x2="105" y2="121" stroke="currentColor" stroke-width="7"/><line x1="89" y1="101" x2="80" y2="110" stroke="currentColor" stroke-width="7"/><line x1="83" y1="85" x2="69" y2="85" stroke="currentColor" stroke-width="7"/><line x1="89" y1="69" x2="80" y2="60" stroke="currentColor" stroke-width="7"/><line x1="105" y1="63" x2="105" y2="49" stroke="currentColor" stroke-width="7"/><line x1="121" y1="69" x2="130" y2="60" stroke="currentColor" stroke-width="7"/><line x1="146" y1="102" x2="157" y2="106" stroke="currentColor" stroke-width="7"/><line x1="122" y1="126" x2="126" y2="137" stroke="currentColor" stroke-width="7"/><line x1="88" y1="126" x2="84" y2="137" stroke="currentColor" stroke-width="7"/><line x1="64" y1="102" x2="53" y2="106" stroke="currentColor" stroke-width="7"/><line x1="64" y1="68" x2="53" y2="64" stroke="currentColor" stroke-width="7"/><line x1="88" y1="44" x2="84" y2="33" stroke="currentColor" stroke-width="7"/><line x1="122" y1="44" x2="126" y2="33" stroke="currentColor" stroke-width="7"/><line x1="146" y1="68" x2="157" y2="64" stroke="currentColor" stroke-width="7"/><circle cx="105" cy="85" r="40" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 5"/><text x="0" y="182" font-size="18" text-anchor="start" fill="currentColor">nét đậm: vùng tinh thể</text><text x="0" y="206" font-size="18" text-anchor="start" fill="currentColor">nét mảnh: vô định hình</text></g></g><g data-buoc="2"><g transform="translate(285,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">2 · Nước vào</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">vùng vô định hình</text><circle cx="105" cy="85" r="68" fill="none" stroke="currentColor" stroke-width="3"/><line x1="127" y1="85" x2="141" y2="85" stroke="currentColor" stroke-width="7"/><line x1="121" y1="101" x2="130" y2="110" stroke="currentColor" stroke-width="7"/><line x1="105" y1="107" x2="105" y2="121" stroke="currentColor" stroke-width="7"/><line x1="89" y1="101" x2="80" y2="110" stroke="currentColor" stroke-width="7"/><line x1="83" y1="85" x2="69" y2="85" stroke="currentColor" stroke-width="7"/><line x1="89" y1="69" x2="80" y2="60" stroke="currentColor" stroke-width="7"/><line x1="105" y1="63" x2="105" y2="49" stroke="currentColor" stroke-width="7"/><line x1="121" y1="69" x2="130" y2="60" stroke="currentColor" stroke-width="7"/><line x1="146" y1="102" x2="157" y2="106" stroke="currentColor" stroke-width="7"/><line x1="122" y1="126" x2="126" y2="137" stroke="currentColor" stroke-width="7"/><line x1="88" y1="126" x2="84" y2="137" stroke="currentColor" stroke-width="7"/><line x1="64" y1="102" x2="53" y2="106" stroke="currentColor" stroke-width="7"/><line x1="64" y1="68