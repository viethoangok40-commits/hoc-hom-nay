rentColor">con lăn</text><text class="bt" x="470" y="207" font-size="18" text-anchor="middle" fill="currentColor">cuộn 2</text><text class="bt" x="445" y="450" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">3. Ghép với</text><text class="bt" x="445" y="474" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">con lăn cuộn 2</text><text class="bt" x="270" y="520" font-size="18" text-anchor="middle" fill="currentColor">mép nắp và vành thân móc vào nhau rồi ép chặt</text></g></svg>