<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Phân luồng một chiều</title><desc>Sơ đồ mặt bằng tối giản: vùng bẩn xử lý nguyên liệu thô và vùng sạch đóng gói thành phẩm có tường ngăn; mũi tên sản phẩm đi một chiều từ vùng bẩn sang vùng sạch, mũi tên ngược chiều bị chặn.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><g data-buoc="1"><text x="10" y="50" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Phân luồng một chiều: bẩn sang sạch</text><rect x="20" y="110" width="215" height="250" rx="8" fill="none" stroke="currentColor" stroke-width="3" class="bt"/><rect x="305" y="110" width="215" height="250" rx="8" fill="none" stroke="currentColor" stroke-width="3" class="bt"/><text x="127" y="150" font-size="20" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Vùng bẩn</text><text x="127" y="178" font-size="18" text-anchor="middle" class="bt" fill="currentColor">xử lý nguyên liệu thô</text><text x="412" y="150" font-size="20" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Vùng sạch</text><text x="412" y="178" font-size="18" text-anchor="middle" class="bt" fill="currentColor">đóng gói thành phẩm</text><line x1="270" y1="100" x2="270" y2="230" stroke="currentColor" stroke-width="8" stroke-linecap="round" class="bt"/><line x1="270" y1="290" x2="270" y2="360" stroke="currentColor" stroke-width="8" stroke-linecap="round" class="bt"/><text x="10" y="438" font-size="18" text-anchor="start" class="bt" fill="currentColor">1 · Hai khu biệt lập: vùng bẩn và vùng sạch</text></g><g data-buoc="2"><line x1="60" y1="260" x2="455" y2="260" stroke="currentColor" stroke-width="5" stroke-linecap="round" class="bt"/><polygon points="455,248 480,260 455,272" fill="currentColor" class="bt"/><text x="270" y="386" font-size="18" text-anchor="middle" class="bt" fill="currentColor">sản phẩm đi một chiều: bẩn sang sạch</text><text x="10" y="462" font-size="18" text-anchor="start" class="bt" fill="currentColor">2 · Sản phẩm đi một chiều từ bẩn sang sạch</text></g><g data-buoc="3"><line x1="480" y1="320" x2="312" y2="320" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" class="bt"/><polygon points="312,308 294,320 312,332" fill="currentColor" class="bt"/><line x1="258" y1="308" x2="282" y2="332" stroke="currentColor" stroke-width="5" stroke-linecap="round" class="bt"/><line x1="282" y1="308" x2="258" y2="332" stroke="currentColor" stroke-width="5" stroke-linecap="round" class="bt"/><text x="270" y="412" font-size="18" text-anchor="middle" class="bt" fill="currentColor">không đi ngược chiều: bị chặn</text><text x="10" y="486" font-size="18" text-anchor="start" class="bt" fill="currentColor">3 · Không đi ngược chiều từ sạch về bẩn</text></g></svg>