<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" role="img" width="540" height="380"><title>Công nghệ hàng rào: nhiều rào nhỏ phối hợp thay cho một rào lớn</title><desc>Hai đường chạy cho vi sinh vật. Đường trên có một rào cao. Đường dưới có bốn rào thấp lần lượt là aw, pH, nhiệt độ và chất bảo quản; khi đủ bốn rào, vi sinh vật cũng bị chặn.</desc><style>
.hr-hop{animation:hr-hop 1.2s ease-in-out both}
@keyframes hr-hop{from{transform:translateY(-10px)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.hr-hop{animation-duration:.001ms;animation-delay:0s}}
</style><g data-buoc="1"><text x="10" y="28" font-size="21" font-weight="700" fill="currentColor">Một rào lớn</text><path d="M10,150 H530" stroke="currentColor" stroke-width="3"/><g class="hr-hop"><circle cx="46" cy="132" r="16" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="46" cy="132" r="5" fill="currentColor"/></g><text x="46" y="174" font-size="18" text-anchor="middle" fill="currentColor">vi sinh vật</text><rect x="280" y="50" width="18" height="100" fill="currentColor"/><text x="500" y="142" font-size="19" text-anchor="end" fill="currentColor">bị chặn</text><text x="10" y="208" font-size="21" font-weight="700" fill="currentColor">Nhiều rào nhỏ</text><path d="M10,330 H530" stroke="currentColor" stroke-width="3"/><g class="hr-hop"><circle cx="46" cy="312" r="16" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="46" cy="312" r="5" fill="currentColor"/></g><text x="46" y="354" font-size="18" text-anchor="middle" fill="currentColor">vi sinh vật</text></g><g data-buoc="2"><rect x="150" y="290" width="18" height="40" fill="currentColor"/><text x="159" y="354" font-size="18" text-anchor="middle" fill="currentColor">aw</text></g><g data-buoc="3"><rect x="250" y="290" width="18" height="40" fill="currentColor"/><text x="259" y="354" font-size="18" text-anchor="middle" fill="currentColor">pH</text></g><g data-buoc="4"><rect x="350" y="290" width="18" height="40" fill="currentColor"/><text x="359" y="354" font-size="18" text-anchor="middle" fill="currentColor">nhiệt độ</text></g><g data-buoc="5"><rect x="450" y="290" width="18" height="40" fill="currentColor"/><text x="459" y="354" font-size="18" text-anchor="middle" fill="currentColor">bảo quản</text><text x="520" y="282" font-size="19" text-anchor="end" fill="currentColor">bị chặn</text></g></svg>