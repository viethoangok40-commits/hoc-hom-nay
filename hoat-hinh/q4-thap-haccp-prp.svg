<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Tháp HACCP trên PRP</title><desc>Hình tháp rút gọn theo slide Chương 3: tầng đáy là PRP chương trình tiên quyết gồm hai ô GMP và SSOP, tầng trên là HACCP xây trên nền PRP.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><g data-buoc="1"><text x="10" y="50" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Tháp: HACCP đặt trên PRP</text><g transform="translate(0,-45)"><rect x="40" y="330" width="460" height="110" rx="8" fill="none" stroke="currentColor" stroke-width="3" class="bt"/><text x="270" y="358" font-size="20" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">PRP – chương trình tiên quyết</text></g><text x="10" y="438" font-size="18" text-anchor="start" class="bt" fill="currentColor">1 · Nền là PRP: điều kiện, hoạt động cơ bản</text></g><g data-buoc="2"><g transform="translate(0,-45)"><rect x="60" y="372" width="205" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="3" class="bt"/><text x="162" y="408" font-size="22" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">GMP</text><rect x="275" y="372" width="205" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="3" class="bt"/><text x="377" y="408" font-size="22" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">SSOP</text></g><text x="10" y="462" font-size="18" text-anchor="start" class="bt" fill="currentColor">2 · PRP gồm GMP và SSOP</text></g><g data-buoc="3"><g transform="translate(0,-45)"><rect x="130" y="215" width="280" height="100" rx="8" fill="none" stroke="currentColor" stroke-width="4" class="bt"/><text x="270" y="262" font-size="26" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">HACCP</text><text x="270" y="292" font-size="18" text-anchor="middle" class="bt" fill="currentColor">xây trên nền PRP</text><line x1="270" y1="315" x2="270" y2="330" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/></g><text x="10" y="486" font-size="18" text-anchor="start" class="bt" fill="currentColor">3 · HACCP đặt lên PRP: phải có GMP, SSOP trước</text></g></svg>