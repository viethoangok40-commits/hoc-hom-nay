<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Bậc thang năm phương thức quản lý chất lượng</title><desc>Năm bậc đi lên theo slide: kiểm tra loại bỏ sản phẩm không đạt; kiểm soát các yếu tố 4M; đảm bảo tạo niềm tin cho khách hàng; TQC con người chủ đạo; TQM bảo đảm lợi ích mọi bên liên quan.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text x="10" y="40" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Bậc thang quản lý chất lượng</text><rect class="bt" x="10" y="422" width="520" height="80" rx="6" fill="currentColor" fill-opacity="0.09" stroke="currentColor" stroke-width="2"/><text x="24" y="454" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">1 · Kiểm tra</text><text x="24" y="484" font-size="18" text-anchor="start" fill="currentColor">loại bỏ sản phẩm không đạt</text></g><g data-buoc="2"><rect class="bt" x="50" y="334" width="480" height="80" rx="6" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2"/><text x="64" y="366" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">2 · Kiểm soát</text><text x="64" y="396" font-size="18" text-anchor="start" fill="currentColor">kiểm soát các yếu tố 4M</text></g><g data-buoc="3"><rect class="bt" x="90" y="246" width="440" height="80" rx="6" fill="currentColor" fill-opacity="0.17" stroke="currentColor" stroke-width="2"/><text x="104" y="278" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">3 · Đảm bảo</text><text x="104" y="308" font-size="18" text-anchor="start" fill="currentColor">tạo niềm tin cho khách hàng</text></g><g data-buoc="4"><rect class="bt" x="130" y="158" width="400" height="80" rx="6" fill="currentColor" fill-opacity="0.21" stroke="currentColor" stroke-width="2"/><text x="144" y="190" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">4 · TQC</text><text x="144" y="220" font-size="18" text-anchor="start" fill="currentColor">con người đóng vai trò chủ đạo</text></g><g data-buoc="5"><rect class="bt" x="170" y="70" width="360" height="80" rx="6" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="5"/><text x="184" y="102" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">5 · TQM</text><text x="184" y="132" font-size="18" text-anchor="start" fill="currentColor">lợi ích cho mọi bên liên quan</text></g></svg>