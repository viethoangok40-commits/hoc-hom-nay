<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Kỹ thuật ép: bốn giai đoạn áp suất</title><desc>Đồ thị định tính áp suất ép theo thời gian: giai đoạn 1 tăng nhẹ để dịch tự chảy, giai đoạn 2 tăng dần khi dịch tự chảy gần hết, giai đoạn 3 tăng tới mức cao nhất 150 đến 200 at để ép nốt, giai đoạn 4 hạ về áp suất khí quyển để phục hồi độ xốp rồi tăng lại.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="78" y="86" font-size="18" text-anchor="start" fill="currentColor">Áp suất</text><line class="bt" x1="70" y1="100" x2="70" y2="400" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="70" y1="400" x2="510" y2="400" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="70" y1="130" x2="510" y2="130" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text class="bt" x="80" y="121" font-size="18" text-anchor="start" fill="currentColor">150–200 at</text><text class="bt" x="76" y="426" font-size="18" text-anchor="start" fill="currentColor">áp khí quyển</text><text class="bt" x="510" y="426" font-size="18" text-anchor="end" fill="currentColor">thời gian ép</text><polyline class="bt" points="70,380 150,350" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text class="bt" x="110" y="332" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">1</text><text class="bt" x="10" y="462" font-size="18" text-anchor="start" fill="currentColor">1 · tăng nhẹ: dịch tự chảy</text></g><g data-buoc="2"><polyline class="bt" points="150,350 300,232" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text class="bt" x="205" y="262" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">2</text><text class="bt" x="10" y="486" font-size="18" text-anchor="start" fill="currentColor">2 · tự chảy gần hết: tăng dần</text></g><g data-buoc="3"><polyline class="bt" points="300,232 360,130 400,130" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text class="bt" x="318" y="168" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">3</text><text class="bt" x="10" y="510" font-size="18" text-anchor="start" fill="currentColor">3 · sắp hết dịch: tới 150–200 at, ép nốt</text></g><g data-buoc="4"><polyline class="bt" points="400,130 432,400" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline class="bt" points="432,400 510,340" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><text class="bt" x="466" y="270" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">4</text><text class="bt" x="10" y="534" font-size="18" text-anchor="start" fill="currentColor">4 · hạ về khí quyển: phục hồi độ xốp, ép lại</text></g></svg>