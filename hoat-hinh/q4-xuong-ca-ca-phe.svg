<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Xương cá: cà phê không ngon</title><desc>Sơ đồ xương cá minh họa theo slide: xương sống nối về đầu cá là vấn đề cà phê không ngon; bốn nhánh chính là con người, hệ thống hay phương pháp, nguyên vật liệu, máy móc thiết bị, mỗi nhánh vẽ hai nguyên nhân phụ.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><g data-buoc="1"><text x="10" y="50" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Sơ đồ xương cá: cà phê không ngon</text><line x1="20" y1="270" x2="395" y2="270" stroke="currentColor" stroke-width="6" stroke-linecap="round" class="bt"/><polygon points="395,258 415,270 395,282" fill="currentColor" class="bt"/><rect x="415" y="230" width="115" height="80" rx="8" fill="none" stroke="currentColor" stroke-width="3" class="bt"/><text x="472" y="262" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Cà phê</text><text x="472" y="286" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">không ngon</text><text x="10" y="438" font-size="18" text-anchor="start" class="bt" fill="currentColor">1 · Quả ở đầu cá: cà phê không ngon</text></g><g data-buoc="2"><text x="90" y="125" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Con người</text><line x1="90" y1="140" x2="170" y2="270" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="125" y="180" font-size="18" text-anchor="start" class="bt" fill="currentColor">thiếu đào tạo</text><text x="148" y="218" font-size="18" text-anchor="start" class="bt" fill="currentColor">quá nhiều bột</text><text x="10" y="462" font-size="18" text-anchor="start" class="bt" fill="currentColor">2 · Nhánh con người: thiếu đào tạo; quá nhiều bột</text></g><g data-buoc="3"><text x="270" y="125" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Hệ thống, phương pháp</text><line x1="270" y1="140" x2="350" y2="270" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="305" y="180" font-size="18" text-anchor="start" class="bt" fill="currentColor">sai cỡ phin lọc</text><text x="328" y="218" font-size="18" text-anchor="start" class="bt" fill="currentColor">máy tính cũ</text><text x="10" y="486" font-size="18" text-anchor="start" class="bt" fill="currentColor">3 · Nhánh hệ thống: sai cỡ phin lọc; máy tính cũ</text></g><g data-buoc="4"><text x="90" y="412" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Nguyên vật liệu</text><line x1="90" y1="385" x2="170" y2="270" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="137" y="332" font-size="18" text-anchor="start" class="bt" fill="currentColor">đường bị ướt</text><text x="115" y="364" font-size="18" text-anchor="start" class="bt" fill="currentColor">sản phẩm hết hạn</text><text x="10" y="510" font-size="18" text-anchor="start" class="bt" fill="currentColor">4 · Nhánh nguyên vật liệu: đường ướt; hết hạn</text></g><g data-buoc="5"><text x="270" y="412" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Máy móc thiết bị</text><line x1="270" y1="385" x2="350" y2="270" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="317" y="332" font-size="18" text-anchor="start" class="bt" fill="currentColor">màng lọc bẩn</text><text x="295" y="364" font-size="18" text-anchor="start" class="bt" fill="currentColor">máy hâm nóng hỏng</text><text x="10" y="534" font-size="18" text-anchor="start" class="bt" fill="currentColor">5 · Nhánh máy móc: màng lọc bẩn; máy hâm hỏng</text></g></svg>