<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 534" role="img" width="540" height="534"><title>Bốn trường hợp truyền nhiệt theo sản phẩm và bao bì</title><desc>Bốn thanh dài dần: sản phẩm lỏng trong sắt tây truyền nhiệt nhanh nhất, lỏng trong thủy tinh, đặc trong sắt tây, đặc trong thủy tinh chậm nhất; độ dài thanh chỉ thứ tự, không phải số phút.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="36" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Thời gian truyền nhiệt vào tâm hộp</text><g data-buoc="1"><text x="10" y="90" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · Lỏng trong sắt tây</text><text x="10" y="116" font-size="18" text-anchor="start" class="bt" fill="currentColor">Đối lưu, bao bì dẫn nhiệt tốt</text><rect x="10" y="128" width="90" height="22" rx="3" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="2" class="bt"/><text x="110" y="146" font-size="18" text-anchor="start" class="bt" fill="currentColor">ngắn nhất</text></g><g data-buoc="2"><text x="10" y="190" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · Lỏng trong thủy tinh</text><text x="10" y="216" font-size="18" text-anchor="start" class="bt" fill="currentColor">Đối lưu + dẫn nhiệt qua thành dày</text><rect x="10" y="228" width="170" height="22" rx="3" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="2" class="bt"/><text x="190" y="246" font-size="18" text-anchor="start" class="bt" fill="currentColor">dài hơn</text></g><g data-buoc="3"><text x="10" y="290" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · Đặc trong sắt tây</text><text x="10" y="316" font-size="18" text-anchor="start" class="bt" fill="currentColor">Chủ yếu dẫn nhiệt trong sản phẩm</text><rect x="10" y="328" width="280" height="22" rx="3" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="2" class="bt"/><text x="300" y="346" font-size="18" text-anchor="start" class="bt" fill="currentColor">dài hơn nữa</text></g><g data-buoc="4"><text x="10" y="390" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">4 · Đặc trong thủy tinh</text><text x="10" y="416" font-size="18" text-anchor="start" class="bt" fill="currentColor">Dẫn nhiệt, thành thủy tinh dày</text><rect x="10" y="428" width="380" height="22" rx="3" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="2" class="bt"/><text x="400" y="446" font-size="18" text-anchor="start" class="bt" fill="currentColor">dài nhất</text></g><g data-buoc="5"><text x="10" y="492" font-size="19" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Bao bì chỉ ảnh hưởng rõ khi có đối lưu mạnh;</text><text x="10" y="518" font-size="18" text-anchor="start" class="bt" fill="currentColor">sản phẩm đặc thì tính chất sản phẩm quyết định.</text></g></svg>