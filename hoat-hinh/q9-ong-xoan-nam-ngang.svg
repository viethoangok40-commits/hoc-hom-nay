<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Thiết bị gia nhiệt dạng ống xoắn nằm ngang (sơ đồ rút gọn)</title><desc>Một thân hình trụ nằm ngang chứa ống xoắn; rau quả đã nghiền xé, nước quả hoặc bột quả được bơm qua ống xoắn từ trái sang phải và được đun nóng.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="10" y="34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Gia nhiệt ống xoắn nằm ngang</text><rect class="bt" x="100" y="170" width="340" height="200" rx="40" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="4"/><text class="bt" x="270" y="150" font-size="18" text-anchor="middle" fill="currentColor">thân hình trụ nằm ngang</text></g><g data-buoc="2"><path class="bt" d="M120 270 C135 190 155 190 170 270 C185 350 205 350 220 270 C235 190 255 190 270 270 C285 350 305 350 320 270 C335 190 355 190 370 270 C385 350 405 350 420 270" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line class="bt" x1="40" y1="270" x2="120" y2="270" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line class="bt" x1="520" y1="270" x2="520" y2="270" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><line class="bt" x1="40" y1="270" x2="106.0" y2="270.0" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><polygon class="bt" points="119,270 106.0,278.0 106.0,262.0" fill="currentColor"/><text class="bt" x="10" y="252" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">vào</text><text class="bt" x="270" y="410" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">ống xoắn trong thân</text></g><g data-buoc="3"><line class="bt" x1="520" y1="270" x2="440" y2="270" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><path class="bt" d="M420 270 L520 270" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line class="bt" x1="430" y1="270" x2="506.0" y2="270.0" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><polygon class="bt" points="519,270 506.0,278.0 506.0,262.0" fill="currentColor"/><text class="bt" x="478" y="252" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">ra</text><text class="bt" x="270" y="450" font-size="18" text-anchor="middle" fill="currentColor">nguyên liệu nghiền, nước quả,</text><text class="bt" x="270" y="474" font-size="18" text-anchor="middle" fill="currentColor">bột quả đi trong ống</text></g><g data-buoc="4"><text class="bt" x="270" y="508" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">Đun nóng: giảm độ nhớt, rồi cô đặc</text><text class="bt" x="270" y="532" font-size="18" text-anchor="middle" fill="currentColor">(tác nhân nóng: slide chưa ghi)</text></g></svg>