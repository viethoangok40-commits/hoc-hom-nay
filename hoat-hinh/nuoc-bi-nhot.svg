<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" role="img" width="540" height="470"><title>Nước bị nhốt chảy ra khi cắt tế bào, lớp nước bám thành ở lại</title><desc>Bốn khung. Khung 1: tế bào nguyên, nước bị nhốt bên trong, một lớp nước bám sát thành. Khung 2: dao hạ xuống tế bào. Khung 3: thành tế bào vỡ, nước bị nhốt chảy ra. Khung 4: sau khi cắt, mực nước trong tế bào thấp hơn, dịch chảy ra phía dưới, lớp nước bám thành vẫn còn.</desc><style>
.nn-drop{animation:nn-drop 1.3s ease-in both}
.nn-knife{animation:nn-knife 1.1s ease-out both}
@keyframes nn-drop{from{transform:translateY(0);opacity:1}to{transform:translateY(18px);opacity:.5}}
@keyframes nn-knife{from{transform:translateY(-16px)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.nn-drop,.nn-knife{animation-duration:.001ms;animation-delay:0s}}
</style><g data-buoc="1"><g transform="translate(5,50)"><text x="0" y="-32" font-size="22" font-weight="700" fill="currentColor">1 · Nguyên</text><text x="0" y="-8" font-size="18" fill="currentColor">kín, chưa cắt</text><rect x="26" y="26" width="118" height="88" rx="8" fill="currentColor" fill-opacity=".38"/><text x="85" y="62" font-size="18" text-anchor="middle" fill="currentColor">nước</text><text x="85" y="84" font-size="18" text-anchor="middle" fill="currentColor">bị nhốt</text><path d="M32,20 H138 Q150,20 150,32 V108 Q150,120 138,120 H32 Q20,120 20,108 V32 Q20,20 32,20 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M34,26 H136 Q144,26 144,34 V106 Q144,114 136,114 H34 Q26,114 26,106 V34 Q26,26 34,26 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-opacity=".9" stroke-linecap="round"/></g><g transform="translate(185,290)"><text x="0" y="-8" font-size="20" font-weight="700" fill="currentColor">Cách đọc hình</text><rect x="0" y="12" width="26" height="18" rx="4" fill="currentColor" fill-opacity=".38"/><text x="38" y="28" font-size="19" fill="currentColor">nước bị nhốt (chảy ra)</text><path d="M0,56 H26" stroke="currentColor" stroke-width="4" stroke-opacity=".9" stroke-linecap="round"/><text x="38" y="62" font-size="19" fill="currentColor">lớp bám thành (ở lại)</text><text x="0" y="104" font-size="19" fill="currentColor">Sơ đồ minh họa, không</text><text x="0" y="128" font-size="19" fill="currentColor">đúng tỉ lệ thật.</text></g></g><g data-buoc="2"><g transform="translate(185,50)"><text x="0" y="-32" font-size="22" font-weight="700" fill="currentColor">2 · Dao cắt</text><text x="0" y="-8" font-size="18" fill="currentColor">dao hạ xuống</text><rect x="26" y="26" width="118" height="88" rx="8" fill="currentColor" fill-opacity=".38"/><text x="85" y="62" font-size="18" text-anchor="middle" fill="currentColor">nước</text><text x="85" y="84" font-size="18" text-anchor="middle" fill="currentColor">bị nhốt</text><path d="M32,20 H138 Q150,20 150,32 V108 Q150,120 138,120 H32 Q20,120 20,108 V32 Q20,20 32,20 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M34,26 H136 Q144,26 144,34 V106 Q144,114 136,114 H34 Q26,114 26,106 V34 Q26,26 34,26 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-opacity=".9" stroke-linecap="round"/><path class="nn-knife" d="M95,-2 H115 V14 L105,44 L95,14 Z" fill="currentColor" fill-opacity=".8" stroke="currentColor" stroke-width="2"/><text x="124" y="12" font-size="18" fill="currentColor">dao</text></g></g><g data-buoc="3"><g transform="translate(365,50)"><text x="0" y="-32" font-size="22" font-weight="700" fill="currentColor">3 · Thành vỡ</text><text x="0" y="-8" font-size="18" fill="currentColor">nước chảy ra</text><rect x="26" y="26" width="118" height="88" rx="8" fill="currentColor" fill-opacity=".38"/><text x="85" y="62" font-size="18" text-anchor="middle" fill="currentColor">nước</text><text x="85" y="84" font-size="18" text-anchor="middle" fill="currentColor">bị nhốt</text><path d="M95,120 H138 Q150,120 150,108 V32 Q150,20 138,20 H32 Q20,20 20,32 V108 Q20,120 32,120 H75" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M89,114 H136 Q144,114 144,106 V34 Q144,26 136,26 H34 Q26,26 26,34 V106 Q26,114 34,114 H81" fill="none" stroke="currentColor" stroke-width="4" stroke-opacity=".9" stroke-linecap="round"/><circle class="nn-drop" cx="85" cy="128" r="3.6" fill="currentColor" style="animation-delay:0s"/><circle class="nn-drop" cx="85" cy="128" r="3.6" fill="currentColor" style="animation-delay:0.4s"/><circle class="nn-drop" cx="85" cy="128" r="3.6" fill="currentColor" style="animation-delay:0.8s"/></g></g><g data-buoc="4"><g transform="translate(5,290)"><text x="0" y="-32" font-size="22" font-weight="700" fill="currentColor">4 · Sau cắt</text><text x="0" y="-8" font-size="18" fill="currentColor">còn lớp bám</text><rect x="26" y="72" width="118" height="42" rx="6" fill="currentColor" fill-opacity=".38"/><path d="M95,120 H138 Q150,120 150,108 V32 Q150,20 138,20 H32 Q20,20 20,32 V108 Q20,120 32,120 H75" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M89,114 H136 Q144,114 144,106 V34 Q144,26 136,26 H34 Q26,26 26,34 V106 Q26,114 34,114 H81" fill="none" stroke="currentColor" stroke-width="4" stroke-opacity=".9" stroke-linecap="round"/><rect x="30" y="140" width="110" height="9" rx="4" fill="currentColor" fill-opacity=".38"/><text x="85" y="166" font-size="16" text-anchor="middle" fill="currentColor">dịch chảy ra</text></g></g></svg>