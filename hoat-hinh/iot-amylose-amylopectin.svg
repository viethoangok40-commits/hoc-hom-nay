<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Iot nằm trong lõi xoắn của amylose cho màu xanh tím; nhánh của amylopectin làm gián đoạn xoắn nên màu nâu đỏ kém đậm</title><desc>Bốn khung: amylose cuộn xoắn như lò xo; chấm iot nằm trong lõi xoắn tạo màu xanh tím; ở amylopectin nhánh α-1,6 làm đứt đoạn xoắn; xoắn đứt đoạn giữ ít iot nên màu nâu đỏ kém đậm.</desc><style>.hb-p{animation:hb-p 1.2s ease-in-out both}@keyframes hb-p{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.hb-p{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><g transform="translate(5,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">1 · Amylose xoắn</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">như lò xo, lõi rỗng</text><ellipse cx="34" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="58" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="82" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="106" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="130" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="154" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="178" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="202" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><text x="0" y="182" font-size="18" text-anchor="start" fill="currentColor">khoảng 6 glucose</text><text x="0" y="206" font-size="18" text-anchor="start" fill="currentColor">mỗi vòng xoắn</text></g></g><g data-buoc="2"><g transform="translate(285,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">2 · Iot vào lõi</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">phức hợp amylose–iot</text><ellipse cx="34" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="58" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="82" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="106" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="130" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="154" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="178" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="202" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="58" cy="60" r="7" fill="currentColor" class="hb-p"/><circle cx="106" cy="60" r="7" fill="currentColor" class="hb-p"/><circle cx="154" cy="60" r="7" fill="currentColor" class="hb-p"/><circle cx="202" cy="60" r="7" fill="currentColor" class="hb-p"/><text x="20" y="115" font-size="18" text-anchor="start" fill="currentColor" class="hb-p">• = iot (minh họa)</text><text x="0" y="182" font-size="18" text-anchor="start" fill="currentColor">màu xanh tím</text><text x="0" y="206" font-size="18" text-anchor="start" fill="currentColor">(đậm)</text></g></g><g data-buoc="3"><g transform="translate(5,320)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">3 · Amylopectin</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">nhánh làm đứt xoắn</text><ellipse cx="22" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="46" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="70" cy="60" rx="14" ry="24" fill="none" stroke="currentColor" stroke-width="3"/><line x1="84" y1="60" x2="150" y2="60" stroke="