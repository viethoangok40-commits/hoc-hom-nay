<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 572" role="img" width="540" height="572"><title>Validation, giám sát và thẩm tra trên trục thời gian</title><desc>Validation làm trước khi áp dụng và trả lời biện pháp có đủ sức kiểm soát mối nguy không; giám sát làm trong lúc vận hành và trả lời quá trình có đang chạy như dự định không; thẩm tra làm sau và trả lời các yêu cầu đã được đáp ứng chưa. Ví dụ thanh trùng: thí nghiệm chứng minh chế độ đủ mạnh, máy ghi nhiệt độ từng mẻ, người khác xem nhật ký và hiệu chuẩn nhiệt kế.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="38" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Trước · trong · sau</text><g data-buoc="1"><line x1="8" y1="74" x2="8" y2="178" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="92" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · TRƯỚC: validation</text><text x="24" y="118" font-size="18" text-anchor="start" class="bt" fill="currentColor">Biện pháp có đủ sức kiểm soát</text><text x="24" y="144" font-size="18" text-anchor="start" class="bt" fill="currentColor">mối nguy đáng kể không?</text><text x="24" y="170" font-size="18" text-anchor="start" class="bt" fill="currentColor">(đánh giá tương lai)</text></g><g data-buoc="2"><line x1="8" y1="196" x2="8" y2="300" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="214" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · TRONG: giám sát</text><text x="24" y="240" font-size="18" text-anchor="start" class="bt" fill="currentColor">Quá trình có đang chạy</text><text x="24" y="266" font-size="18" text-anchor="start" class="bt" fill="currentColor">như dự định không?</text><text x="24" y="292" font-size="18" text-anchor="start" class="bt" fill="currentColor">(đánh giá hiện tại)</text></g><g data-buoc="3"><line x1="8" y1="318" x2="8" y2="396" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="336" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · SAU: thẩm tra</text><text x="24" y="362" font-size="18" text-anchor="start" class="bt" fill="currentColor">Yêu cầu đã được đáp ứng chưa?</text><text x="24" y="388" font-size="18" text-anchor="start" class="bt" fill="currentColor">(đánh giá quá khứ)</text></g><g data-buoc="4"><line x1="8" y1="414" x2="8" y2="544" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="432" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">4 · Ví dụ thanh trùng</text><text x="24" y="458" font-size="18" text-anchor="start" class="bt" fill="currentColor">Trước: thí nghiệm chứng minh chế độ</text><text x="24" y="484" font-size="18" text-anchor="start" class="bt" fill="currentColor">Trong: máy ghi nhiệt độ từng mẻ</text><text x="24" y="510" font-size="18" text-anchor="start" class="bt" fill="currentColor">Sau: người khác xem nhật ký,</text><text x="24" y="536" font-size="18" text-anchor="start" class="bt" fill="currentColor">hiệu chuẩn nhiệt kế</text></g></svg>