<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Chu trình của tủ lạnh cơ</title><desc>Bốn bộ phận nối thành vòng kín: bộ phận bốc hơi (môi chất lỏng hóa hơi ở áp suất thấp, lấy nhiệt của chất làm lạnh), máy nén (tăng áp suất hơi), bộ phận ngưng tụ (hơi thành lỏng), van giãn nở (giảm áp) rồi quay lại bộ phận bốc hơi. Đường đứt chia khu vực áp suất thấp bên trái và áp suất cao bên phải.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="32" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Tủ lạnh cơ: vòng môi chất lạnh</text><text x="135" y="62" font-size="18" text-anchor="middle" class="bt" fill="currentColor">áp suất thấp</text><text x="405" y="62" font-size="18" text-anchor="middle" class="bt" fill="currentColor">áp suất cao</text><line x1="270" y1="70" x2="270" y2="330" stroke="currentColor" stroke-width="2" stroke-dasharray="4 6" class="bt"/><g data-buoc="1"><rect x="40" y="90" width="190" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="2" class="bt"/><text x="135" y="120" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Bộ phận bốc hơi</text><text x="135" y="145" font-size="18" text-anchor="middle" class="bt" fill="currentColor">lỏng → hơi</text><text x="150" y="192" font-size="18" text-anchor="middle" class="bt" fill="currentColor">thu nhiệt của</text><text x="150" y="214" font-size="18" text-anchor="middle" class="bt" fill="currentColor">chất làm lạnh</text><text x="10" y="384" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · Bốc hơi ở áp suất thấp: lỏng thành hơi,</text><text x="10" y="408" font-size="18" text-anchor="start" class="bt" fill="currentColor">chất làm lạnh bị lấy nhiệt nên lạnh đi</text></g><g data-buoc="2"><line x1="230" y1="125" x2="300.0" y2="125.0" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="310.0,125.0 300.0,120.5 300.0,129.5" fill="currentColor" class="bt"/><rect x="310" y="90" width="190" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="2" class="bt"/><text x="405" y="120" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Máy nén</text><text x="405" y="145" font-size="18" text-anchor="middle" class="bt" fill="currentColor">tăng áp suất hơi</text><text x="10" y="444" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · Hơi môi chất qua máy nén để tăng áp suất</text></g><g data-buoc="3"><line x1="405" y1="160" x2="405.0" y2="240.0" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="405.0,250.0 409.5,240.0 400.5,240.0" fill="currentColor" class="bt"/><rect x="310" y="250" width="190" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="2" class="bt"/><text x="405" y="280" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Bộ phận ngưng tụ</text><text x="405" y="305" font-size="18" text-anchor="middle" class="bt" fill="currentColor">hơi → lỏng</text><text x="405" y="352" font-size="18" text-anchor="middle" class="bt" fill="currentColor">thải nhiệt</text><text x="10" y="472" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · Ngưng tụ: hơi áp suất cao thành lỏng</text></g><g data-buoc="4"><line x1="310" y1="285" x2="240.0" y2="285.0" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="230.0,285.0 240.0,289.5 240.0,280.5" fill="currentColor" class="bt"/><rect x="40" y="250" width="190" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="2" class="bt"/><text x="135" y="280" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Van giãn nở</text><text x="135" y="305" font-size="18" text-anchor="middle" class="bt" fill="currentColor">giảm áp</text><line x1="60" y1="250" x2="60.0" y2="170.0" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="60.0,160.0 55.5,170.0 64.5,170.0" fill="currentColor" class="bt"/><text x="10" y="500" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">4 · Van giãn nở giảm áp, môi chất về bốc hơi</text></g></svg>