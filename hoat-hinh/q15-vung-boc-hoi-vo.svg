<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" role="img" width="540" height="470"><title>Vùng bốc hơi và lớp vỏ khi nướng</title><desc>Mặt cắt miếng bánh: ẩm bề mặt bay hơi, ẩm từ tâm đi ra, vùng bốc hơi lùi vào trong, bề mặt khô thành vỏ gần nhiệt độ lò, tâm không quá 100 độ C.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="34" font-size="21" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Nướng: vùng bốc hơi lùi vào, vỏ hình thành</text><rect x="120" y="70" width="300" height="200" rx="6" fill="none" stroke="currentColor" stroke-width="3" class="bt"/><text x="270" y="292" font-size="18" text-anchor="middle" class="bt" fill="currentColor">mặt cắt miếng bánh</text><g data-buoc="1"><line x1="270" y1="70" x2="270" y2="46" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="270.0,46.0 274.3,55.0 265.7,55.0" fill="currentColor" class="bt"/><line x1="120" y1="130" x2="96" y2="130" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="96.0,130.0 105.0,125.7 105.0,134.3" fill="currentColor" class="bt"/><line x1="420" y1="130" x2="444" y2="130" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="444.0,130.0 435.0,134.3 435.0,125.7" fill="currentColor" class="bt"/><text x="10" y="330" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · Không khí lò khô: ẩm bề mặt bay hơi</text></g><g data-buoc="2"><line x1="225" y1="225" x2="145" y2="225" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="145.0,225.0 154.0,220.7 154.0,229.3" fill="currentColor" class="bt"/><line x1="315" y1="225" x2="395" y2="225" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="395.0,225.0 386.0,229.3 386.0,220.7" fill="currentColor" class="bt"/><text x="10" y="360" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · Bề mặt khô hơn tâm: ẩm từ tâm đi ra</text></g><g data-buoc="3"><rect x="160" y="100" width="220" height="140" rx="6" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="9 6" class="bt"/><text x="270" y="126" font-size="18" text-anchor="middle" class="bt" fill="currentColor">vùng bốc hơi</text><text x="10" y="390" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · Thoát ẩm bề mặt nhanh hơn: vùng bốc hơi lùi vào</text></g><g data-buoc="4"><rect x="126" y="76" width="288" height="188" rx="6" fill="none" stroke="currentColor" stroke-width="12" class="bt"/><text x="10" y="420" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">4 · Bề mặt khô thành lớp vỏ, gần 110–240 °C</text></g><g data-buoc="5"><text x="270" y="180" font-size="20" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">tâm ≤ 100 °C</text><text x="10" y="450" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">5 · Tâm ở áp suất khí quyển: không quá 100 °C</text></g></svg>