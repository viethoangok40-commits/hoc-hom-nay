<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 572" role="img" width="540" height="572"><title>Chuỗi hư hỏng của dầu chiên</title><desc>Năm khối hiện lần lượt: thủy phân nhờ nước của thực phẩm, oxy hóa bậc 1 tạo hydroperoxide, oxy hóa bậc 2 tạo aldehyde và ketone, polymer hóa, và hệ quả độ nhớt tăng, màu sậm.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="36" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Dầu chiên hư hỏng theo chuỗi</text><g data-buoc="1"><line x1="8" y1="62" x2="8" y2="142" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="80" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · Thủy phân (cần nước của thực phẩm)</text><text x="24" y="106" font-size="18" text-anchor="start" class="bt" fill="currentColor">Triglyceride → di-, monoglyceride,</text><text x="24" y="132" font-size="18" text-anchor="start" class="bt" fill="currentColor">glycerol + acid béo tự do</text><line x1="500" y1="124" x2="500" y2="158" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="500.0,158.0 495.7,149.0 504.3,149.0" fill="currentColor" class="bt"/></g><g data-buoc="2"><line x1="8" y1="162" x2="8" y2="242" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="180" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · Oxy hóa bậc 1</text><text x="24" y="206" font-size="18" text-anchor="start" class="bt" fill="currentColor">Oxy tạo gốc tự do và hydroperoxide</text><text x="24" y="232" font-size="18" text-anchor="start" class="bt" fill="currentColor">(chỉ số peroxide đo nhóm này)</text><line x1="500" y1="224" x2="500" y2="258" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="500.0,258.0 495.7,249.0 504.3,249.0" fill="currentColor" class="bt"/></g><g data-buoc="3"><line x1="8" y1="262" x2="8" y2="342" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="280" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · Oxy hóa bậc 2</text><text x="24" y="306" font-size="18" text-anchor="start" class="bt" fill="currentColor">Hydroperoxide → aldehyde, ketone;</text><text x="24" y="332" font-size="18" text-anchor="start" class="bt" fill="currentColor">phần lớn bay hơi, có chất tạo mùi chiên</text><line x1="500" y1="324" x2="500" y2="358" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="500.0,358.0 495.7,349.0 504.3,349.0" fill="currentColor" class="bt"/></g><g data-buoc="4"><line x1="8" y1="362" x2="8" y2="442" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="380" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">4 · Polymer hóa</text><text x="24" y="406" font-size="18" text-anchor="start" class="bt" fill="currentColor">Dimer, trimer, polymer phân cực,</text><text x="24" y="432" font-size="18" text-anchor="start" class="bt" fill="currentColor">phân tử lượng cao, không bay hơi</text><line x1="500" y1="424" x2="500" y2="458" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="500.0,458.0 495.7,449.0 504.3,449.0" fill="currentColor" class="bt"/></g><g data-buoc="5"><line x1="8" y1="462" x2="8" y2="542" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="480" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">5 · Hệ quả cho dầu</text><text x="24" y="506" font-size="18" text-anchor="start" class="bt" fill="currentColor">Độ nhớt tăng, màu sậm dần;</text><text x="24" y="532" font-size="18" text-anchor="start" class="bt" fill="currentColor">theo dõi chỉ số acid và peroxide</text></g></svg>