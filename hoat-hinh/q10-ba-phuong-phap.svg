<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Ba phương pháp cô đặc</title><desc>Ba hàng: bốc hơi nước (cấp nhiệt, hơi nước bay đi, dịch đặc dần); kết tinh dung môi (làm lạnh dưới điểm đóng băng, đá tách ra); thẩm thấu nghịch (áp suất cao hơn áp suất thẩm thấu đẩy nước qua màng bán thấm).</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="10" y="34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Ba phương pháp cô đặc</text><path class="bt" d="M30 100 L30 190 L130 190 L130 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line class="bt" x1="55" y1="70" x2="55" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="80" y1="70" x2="80" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="105" y1="70" x2="105" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="55" y1="90" x2="55.0" y2="69.0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><polygon class="bt" points="55,56 63.0,69.0 47.0,69.0" fill="currentColor"/><line class="bt" x1="80" y1="90" x2="80.0" y2="69.0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><polygon class="bt" points="80,56 88.0,69.0 72.0,69.0" fill="currentColor"/><line class="bt" x1="105" y1="90" x2="105.0" y2="69.0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><polygon class="bt" points="105,56 113.0,69.0 97.0,69.0" fill="currentColor"/><text class="bt" x="150" y="118" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">1 Bốc hơi nước</text><text class="bt" x="150" y="144" font-size="18" text-anchor="start" fill="currentColor">cấp nhiệt, nước bay hơi</text><text class="bt" x="150" y="170" font-size="18" text-anchor="start" fill="currentColor">khi sôi</text><line class="bt" x1="75" y1="230" x2="75.0" y2="209.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="75,196 83.0,209.0 67.0,209.0" fill="currentColor"/><text class="bt" x="150" y="196" font-size="18" text-anchor="start" fill="currentColor">→ dịch đặc dần</text></g><g data-buoc="2"><path class="bt" d="M30 290 L30 380 L130 380 L130 290" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path class="bt" d="M55 311 L64 317 L64 327 L55 333 L46 327 L46 317 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path class="bt" d="M85 336 L94 342 L94 352 L85 358 L76 352 L76 342 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path class="bt" d="M105 306 L114 312 L114 322 L105 328 L96 322 L96 312 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text class="bt" x="150" y="308" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">2 Kết tinh dung môi</text><text class="bt" x="150" y="334" font-size="18" text-anchor="start" fill="currentColor">lạnh dưới điểm</text><text class="bt" x="150" y="358" font-size="18" text-anchor="start" fill="currentColor">đóng băng, đá tách ra</text><text class="bt" x="150" y="382" font-size="18" text-anchor="start" fill="currentColor">(cô đặc lạnh)</text></g><g data-buoc="3"><path class="bt" d="M30 430 L130 430 L130 500 L30 500 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line class="bt" x1="80" y1="430" x2="80" y2="500" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 5"/><circle class="bt" cx="45" cy="450" r="4" fill="currentColor"/><circle class="bt" cx="60" cy="478" r="4" fill="currentColor"/><circle class="bt" cx="50" cy="492" r="4" fill="currentColor"/><circle class="bt" cx="66" cy="455" r="4" fill="currentColor"/><line class="bt" x1="40" y1="466" x2="57.0" y2="466.0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><polygon class="bt" points="70,466 57.0,474.0 57.0,458.0" fill="currentColor"/><line class="bt" x1="90" y1="486" x2="107.0" y2="486.0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><polygon class="bt" points="120,486 107.0,494.0 107.0,478.0" fill="currentColor"/><text class="bt" x="150" y="450" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">3 Thẩm thấu nghịch</text><text class="bt" x="150" y="476" font-size="18" text-anchor="start" fill="currentColor">màng bán thấm, áp suất</text><text class="bt" x="150" y="500" font-size="18" text-anchor="start" fill="currentColor">đẩy nước qua màng</text><text class="bt" x="150" y="524" font-size="18" text-anchor="start" fill="currentColor">(kiến thức thêm)</text></g></svg>