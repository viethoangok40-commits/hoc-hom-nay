<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" role="img" width="540" height="520"><title>Hình thành liên kết ion trong muối ăn</title><desc>Bốn khung: nguyên tử Na có 1 electron lớp ngoài và Cl có 7; electron chuyển từ Na sang Cl; thành hai ion trái dấu đều có 8 electron lớp ngoài; các ion xếp xen kẽ thành tinh thể NaCl.</desc><style>.na-e{animation:na-e 1.3s ease-in-out both}@keyframes na-e{from{transform:translateX(-80px)}to{transform:translateX(0)}}@media (prefers-reduced-motion:reduce){.na-e{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><g transform="translate(5,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">1 · Hai nguyên tử</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">lớp ngoài: Na 1, Cl 7</text><circle cx="60" cy="95" r="34" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="26.0" cy="95.0" r="4" fill="currentColor"/><text x="60" y="101" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">Na</text><circle cx="190" cy="95" r="34" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="224.0" cy="95.0" r="4" fill="currentColor"/><circle cx="214.0" cy="119.0" r="4" fill="currentColor"/><circle cx="190.0" cy="129.0" r="4" fill="currentColor"/><circle cx="166.0" cy="119.0" r="4" fill="currentColor"/><circle cx="156.0" cy="95.0" r="4" fill="currentColor"/><circle cx="166.0" cy="71.0" r="4" fill="currentColor"/><circle cx="190.0" cy="61.0" r="4" fill="currentColor"/><text x="190" y="101" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">Cl</text><text x="60" y="150" font-size="19" text-anchor="middle" fill="currentColor">1 e⁻</text><text x="190" y="150" font-size="19" text-anchor="middle" fill="currentColor">7 e⁻</text></g></g><g data-buoc="2"><g transform="translate(285,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">2 · Electron chuyển</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">Na nhường, Cl nhận</text><circle cx="60" cy="95" r="34" fill="none" stroke="currentColor" stroke-width="3"/><text x="60" y="101" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">Na</text><circle cx="190" cy="95" r="34" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="224.0" cy="95.0" r="4" fill="currentColor"/><circle cx="214.0" cy="119.0" r="4" fill="currentColor"/><circle cx="190.0" cy="129.0" r="4" fill="currentColor"/><circle cx="166.0" cy="119.0" r="4" fill="currentColor"/><circle cx="156.0" cy="95.0" r="4" fill="currentColor"/><circle cx="166.0" cy="71.0" r="4" fill="currentColor"/><circle cx="190.0" cy="61.0" r="4" fill="currentColor"/><text x="190" y="101" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">Cl</text><g class="na-e"><circle cx="125" cy="62" r="5" fill="currentColor"/></g><path d="M80,62 H160" stroke="currentColor" stroke-width="3" stroke-dasharray="6 5"/><path d="M160,62 l-10,-6 v12 z" fill="currentColor"/><text x="125" y="150" font-size="19" text-anchor="middle" fill="currentColor">1 e⁻ chuyển sang Cl</text></g></g><g data-buoc="3"><g transform="translate(5,300)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">3 · Hai ion</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">trái dấu hút nhau</text><circle cx="60" cy="95" r="26" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="84.1" cy="104.7" r="4" fill="currentColor"/><circle cx="70.2" cy="118.9" r="4" fill="currentColor"/><circle cx="50.3" cy="119.1" r="4" fill="currentColor"/><circle cx="36.1" cy="105.2" r="4" fill="currentColor"/><circle cx="35.9" cy="85.3" r="4" fill="currentColor"/><circle cx="49.8" cy="71.1" r="4" fill="currentColor"/><circle cx="69.7" cy="70.9" r="4" fill="currentColor"/><circle cx="83.9" cy="84.8" r="4" fill="currentColor"/><text x="60" y="101" font-size="19" font-weight="700" text-anchor="middle" fill="currentColor">Na⁺</text><circle cx="190" cy="95" r="34" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="221.5" cy="107.7" r="4" fill="currentColor"/><circle cx="203.3" cy="126.3" r="4" fill="currentColor"/><circle cx="177.3" cy="126.5" r="4" fill="currentColor"/><circle cx="158.7" cy="108.3" r="4" fill="currentColor"/><circle cx="158.5" cy="82.3" r="4" fill="currentColor"/><circle cx="176.7" cy="63.7" r="4" fill="currentColor"/><circle cx="202.7" cy="63.5" r="4" fill="currentColor"/><circle cx="221.3" cy="81.7" r="4" fill="currentColor"/><text x="190" y="101" font-size="19" font-weight="700" text-anchor="middle" fill="currentColor">Cl⁻</text><text x="125" y="150" font-size="19" text-anchor="middle" fill="currentColor">cả hai đủ 8 e⁻ (octet)</text></g></g><g data-buoc="4"><g transform="translate(285,300)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">4 · Tinh thể</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">Na⁺ và Cl⁻ xen kẽ</text><circle cx="40" cy="40" r="19" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="3"/><text x="40" y="47" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">+</text><circle cx="90" cy="40" r="19" fill="none" stroke="currentColor" stroke-width="3"/><text x="90" y="47" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">−</text><circle cx="140" cy="40" r="19" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="3"/><text x="140" y="47" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">+</text><circle cx="40" cy="90" r="19" fill="none" stroke="currentColor" stroke-width="3"/><text x="40" y="97" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">−</text><circle cx="90" cy="90" r="19" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="3"/><text x="90" y="97" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">+</text><circle cx="140" cy="90" r="19" fill="none" stroke="currentColor" stroke-width="3"/><text x="140" y="97" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">−</text><circle cx="40" cy="140" r="19" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="3"/><text x="40" y="147" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">+</text><circle cx="90" cy="140" r="19" fill="none" stroke="currentColor" stroke-width="3"/><text x="90" y="147" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">−</text><circle cx="140" cy="140" r="19" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="3"/><text x="140" y="147" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">+</text><text x="0" y="195" font-size="19" text-anchor="start" fill="currentColor">tinh thể NaCl (muối ăn)</text></g></g></svg>