<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Máy chà: cánh đập, rây, bột chà và bã</title><desc>Sơ đồ cắt dọc máy chà: nguyên liệu vào phễu, cánh đập quay khoảng 700 vòng mỗi phút văng và ép nguyên liệu vào rây cố định, phần mềm lọt qua lỗ rây thành bột chà, cánh nghiêng 1,5 đến 2 độ đẩy bã đi xoắn ốc ra cuối máy.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="10" y="36" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Máy chà (cắt dọc)</text><text class="bt" x="30" y="120" font-size="18" text-anchor="start" fill="currentColor">Nguyên liệu vào</text><polyline class="bt" points="60,130 150,130 120,230 90,230" fill="currentColor" fill-opacity="0.09" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect class="bt" x="40" y="230" width="420" height="110" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="3"/><text class="bt" x="400" y="215" font-size="18" text-anchor="middle" fill="currentColor">Rây cố định</text><line class="bt" x1="40" y1="285" x2="460" y2="285" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></g><g data-buoc="2"><line class="bt" x1="95" y1="285" x2="121" y2="233" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line class="bt" x1="108" y1="285" x2="134" y2="331" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line class="bt" x1="165" y1="285" x2="191" y2="233" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line class="bt" x1="178" y1="285" x2="204" y2="331" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line class="bt" x1="235" y1="285" x2="261" y2="233" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line class="bt" x1="248" y1="285" x2="274" y2="331" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line class="bt" x1="305" y1="285" x2="331" y2="233" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line class="bt" x1="318" y1="285" x2="344" y2="331" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line class="bt" x1="375" y1="285" x2="401" y2="233" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line class="bt" x1="388" y1="285" x2="414" y2="331" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><text class="bt" x="300" y="180" font-size="18" text-anchor="middle" fill="currentColor">Cánh đập quay ~700 v/ph</text></g><g data-buoc="3"><line class="bt" x1="150" y1="340" x2="150" y2="382" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="230" y1="340" x2="230" y2="382" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="310" y1="340" x2="310" y2="382" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><line class="bt" x1="390" y1="340" x2="390" y2="382" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><polyline class="bt" points="80,392 420,392 400,432 100,432" fill="currentColor" fill-opacity="0.09" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text class="bt" x="250" y="466" font-size="18" text-anchor="middle" fill="currentColor">Bột chà (lọt qua lỗ rây)</text></g><g data-buoc="4"><polyline class="bt" points="70,300 150,262 230,304 310,262 390,304 455,285" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><line class="bt" x1="460" y1="285" x2="515" y2="285" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><text class="bt" x="490" y="262" font-size="18" text-anchor="middle" fill="currentColor">Bã chà</text><text class="bt" x="10" y="510" font-size="18" text-anchor="start" fill="currentColor">Cánh nghiêng 1,5–2°: bã đi xoắn ốc ra cuối máy</text></g></svg>