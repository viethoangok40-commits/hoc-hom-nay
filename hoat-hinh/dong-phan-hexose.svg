<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Glucose, galactose và fructose đều là C6H12O6 nhưng khác ở nhóm carbonyl hoặc ở hướng OH của C4</title><desc>Ba hình chiếu Fischer đứng cạnh nhau. Glucose có nhóm aldehyde ở C1. Galactose giống glucose nhưng OH ở C4 quay sang trái. Fructose có nhóm ketone ở C2 và từ C3 đến C6 giống glucose.</desc><style>.hb-p{animation:hb-p 1.2s ease-in-out both}@keyframes hb-p{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.hb-p{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><g transform="translate(0,0)"><text x="8" y="36" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">1 · Glucose</text><text x="8" y="62" font-size="18" text-anchor="start" fill="currentColor">aldose (CHO ở C1)</text><line x1="100" y1="108" x2="100" y2="384" stroke="currentColor" stroke-width="3"/><text x="100" y="100" font-size="18" text-anchor="middle" fill="currentColor">CHO</text><text x="8" y="100" font-size="18" text-anchor="start" fill="currentColor">C1</text><text x="8" y="170" font-size="18" text-anchor="start" fill="currentColor">C2</text><line x1="100" y1="164" x2="120" y2="164" stroke="currentColor" stroke-width="3"/><text x="124" y="170" font-size="18" text-anchor="start" fill="currentColor">OH</text><text x="8" y="230" font-size="18" text-anchor="start" fill="currentColor">C3</text><line x1="100" y1="224" x2="80" y2="224" stroke="currentColor" stroke-width="3"/><text x="76" y="230" font-size="18" text-anchor="end" fill="currentColor">OH</text><text x="8" y="290" font-size="18" text-anchor="start" fill="currentColor">C4</text><line x1="100" y1="284" x2="120" y2="284" stroke="currentColor" stroke-width="3"/><text x="124" y="290" font-size="18" text-anchor="start" fill="currentColor">OH</text><text x="8" y="350" font-size="18" text-anchor="start" fill="currentColor">C5</text><line x1="100" y1="344" x2="120" y2="344" stroke="currentColor" stroke-width="3"/><text x="124" y="350" font-size="18" text-anchor="start" fill="currentColor">OH</text><text x="100" y="410" font-size="18" text-anchor="middle" fill="currentColor">CH2OH</text><text x="8" y="410" font-size="18" text-anchor="start" fill="currentColor">C6</text><text x="8" y="462" font-size="18" text-anchor="start" fill="currentColor">nhóm aldehyde</text><text x="8" y="486" font-size="18" text-anchor="start" fill="currentColor">ở C1</text></g></g><g data-buoc="2"><g transform="translate(180,0)"><text x="8" y="36" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">2 · Galactose</text><text x="8" y="62" font-size="18" text-anchor="start" fill="currentColor">aldose (CHO ở C1)</text><line x1="100" y1="108" x2="100" y2="384" stroke="currentColor" stroke-width="3"/><text x="100" y="100" font-size="18" text-anchor="middle" fill="currentColor">CHO</text><text x="8" y="100" font-size="18" text-anchor="start" fill="currentColor">C1</text><text x="8" y="170" font-size="18" text-anchor="start" fill="currentColor">C2</text><line x1="100" y1="164" x2="120" y2="164" stroke="currentColor" stroke-width="3"/><text x="124" y="170" font-size="18" text-anchor="start" fill="currentColor">OH</text><text x="8" y="230" font-size="18" text-anchor="start" fill="currentColor">C3</text><line x1="100" y1="224" x2="80" y2="224" stroke="currentColor" stroke-width="3"/><text x="76" y="230" font-size="18" text-anchor="end" fill="currentColor">OH</text><text x="8" y="290" font-size="18" text-anchor="start" fill="currentColor">C4</text><line x1="100" y1="284" x2="80" y2="284" stroke="currentColor" stroke-width="3"/><text x="76" y="290" font-size="18" text-anchor="end" fill="currentColor">OH</text><text x="8" y="350" font-size="18" text-anchor="start" fill="currentColor">C5</text><line x1="100" y1="344" x2="120" y2="344" stroke="currentColor" stroke-width="3"/><text x="124" y="350" font-size="18" text-anchor="start" fill="currentColor">OH</text><text x="100" y="410" font-size="18" text-anchor="middle" fill="currentColor">CH2OH</text><text x="8" y="410" font-size="18" text-anchor="start" fill="currentColor">C6</text><rect class="hb-p" x="44" y="262" width="36" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><text x="8" y="462" font-size="18" text-anchor="start" fill="currentColor">chỉ khác glucose</text><text x="8" y="486" font-size="18" text-anchor="start" fill="currentColor">ở OH của C4</text></g></g><g data-buoc="3"><g transform="translate(360,0)"><text x="8" y="36" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">3 · Fructose</text><text x="8" y="62" font-size="18" text-anchor="start" fill="currentColor">ketose (C=O ở C2)</text><line x1="100" y1="108" x2="100" y2="384" stroke="currentColor" stroke-width="3"/><text x="100" y="100" font-size="18" text-anchor="middle" fill="currentColor">CH2OH</text><text x="8" y="100" font-size="18" text-anchor="start" fill="currentColor">C1</text><text x="8" y="170" font-size="18" text-anchor="start" fill="currentColor">C2</text><text x="104" y="170" font-size="18" text-anchor="start" fill="currentColor">=O</text><text x="8" y="230" font-size="18" text-anchor="start" fill="currentColor">C3</text><line x1="100" y1="224" x2="80" y2="224" stroke="currentColor" stroke-width="3"/><text x="76" y="230" font-size="18" text-anchor="end" fill="currentColor">OH</text><text x="8" y="290" font-size="18" text-anchor="start" fill="currentColor">C4</text><line x1="100" y1="284" x2="120" y2="284" stroke="currentColor" stroke-width="3"/><text x="124" y="290" font-size="18" text-anchor="start" fill="currentColor">OH</text><text x="8" y="350" font-size="18" text-anchor="start" fill="currentColor">C5</text><line x1="100" y1="344" x2="120" y2="344" stroke="currentColor" stroke-width="3"/><text x="124" y="350" font-size="18" text-anchor="start" fill="currentColor">OH</text><text x="100" y="410" font-size="18" text-anchor="middle" fill="currentColor">CH2OH</text><text x="8" y="410" font-size="18" text-anchor="start" fill="currentColor">C6</text><rect class="hb-p" x="98" y="148" width="40" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><text x="8" y="462" font-size="18" text-anchor="start" fill="currentColor">nhóm ketone</text><text x="8" y="486" font-size="18" text-anchor="start" fill="currentColor">ở C2</text></g></g></svg>