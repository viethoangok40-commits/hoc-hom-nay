<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 588" role="img" width="540" height="588"><title>Cây quyết định CCP theo Codex 2020</title><desc>Bốn câu hỏi hiện lần lượt: Q1 chương trình tiên quyết đã kiểm soát được mối nguy đáng kể chưa, Q2 có biện pháp kiểm soát riêng không, Q3 bước sau có xử lý mối nguy không, Q4 chính bước này có kiểm soát riêng được không; mỗi câu có nhánh có và không.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="38" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Cây quyết định CCP (Codex 2020)</text><g data-buoc="1"><line x1="8" y1="74" x2="8" y2="182" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="92" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Q1 · PRP (như GHP) đã kiểm soát được</text><text x="24" y="120" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">mối nguy đáng kể ở bước này chưa?</text><text x="24" y="148" font-size="18" text-anchor="start" class="bt" fill="currentColor">Có → không phải CCP</text><text x="24" y="174" font-size="18" text-anchor="start" class="bt" fill="currentColor">Không → sang Q2</text></g><g data-buoc="2"><line x1="8" y1="200" x2="8" y2="308" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="218" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Q2 · Ở bước này có biện pháp</text><text x="24" y="246" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">kiểm soát riêng cho mối nguy không?</text><text x="24" y="274" font-size="18" text-anchor="start" class="bt" fill="currentColor">Không → sửa bước, quá trình, sản phẩm</text><text x="24" y="300" font-size="18" text-anchor="start" class="bt" fill="currentColor">Có → sang Q3</text></g><g data-buoc="3"><line x1="8" y1="326" x2="8" y2="434" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="344" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Q3 · Bước sau có ngăn, loại bỏ hay</text><text x="24" y="372" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">giảm mối nguy tới mức chấp nhận?</text><text x="24" y="400" font-size="18" text-anchor="start" class="bt" fill="currentColor">Có → kiểm soát ở bước sau</text><text x="24" y="426" font-size="18" text-anchor="start" class="bt" fill="currentColor">Không → sang Q4</text></g><g data-buoc="4"><line x1="8" y1="452" x2="8" y2="560" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="470" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Q4 · Chính bước này kiểm soát riêng</text><text x="24" y="498" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">được mối nguy không?</text><text x="24" y="526" font-size="18" text-anchor="start" class="bt" fill="currentColor">Có → bước này là CCP</text><text x="24" y="552" font-size="18" text-anchor="start" class="bt" fill="currentColor">Không → sửa bước, quá trình</text></g></svg>