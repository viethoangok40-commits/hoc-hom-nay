<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Nồi chần – hấp hai vỏ làm việc gián đoạn (sơ đồ rút gọn)</title><desc>Sơ đồ mặt cắt tự vẽ theo chú thích 1–11 của slide: vỏ trong 1 chứa nguyên liệu, vỏ ngoài 2, phòng hơi 3 giữa hai vỏ, hơi vào qua ống 4, ống tháo 5 và van tháo nước ngưng 6, van hơi an toàn 7, áp kế 8, giá đỡ 9, tay quay 10 và bánh quay răng khía 11.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="10" y="34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Nồi hai vỏ (chần gián đoạn)</text><path class="bt" d="M135 150 L135 300 Q135 375 250 375 Q365 375 365 300 L365 150" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path class="bt" d="M165 150 L165 290 Q165 345 250 345 Q335 345 335 290 L335 150" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line class="bt" x1="165" y1="150" x2="335" y2="150" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><circle class="bt" cx="215" cy="300" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="255" cy="315" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="300" cy="295" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="240" cy="270" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><text class="bt" x="250" y="232" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">1 vỏ trong</text><text class="bt" x="112" y="262" font-size="18" font-weight="700" text-anchor="end" fill="currentColor">2</text><line class="bt" x1="114" y1="258" x2="133" y2="258" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><text class="bt" x="112" y="284" font-size="18" text-anchor="end" fill="currentColor">vỏ ngoài</text></g><g data-buoc="2"><circle class="bt" cx="150" cy="190" r="4" fill="currentColor"/><circle class="bt" cx="150" cy="230" r="4" fill="currentColor"/><circle class="bt" cx="150" cy="270" r="4" fill="currentColor"/><circle class="bt" cx="150" cy="310" r="4" fill="currentColor"/><circle class="bt" cx="350" cy="190" r="4" fill="currentColor"/><circle class="bt" cx="350" cy="230" r="4" fill="currentColor"/><circle class="bt" cx="350" cy="270" r="4" fill="currentColor"/><circle class="bt" cx="350" cy="310" r="4" fill="currentColor"/><line class="bt" x1="365" y1="205" x2="440" y2="205" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><line class="bt" x1="440" y1="205" x2="379.0" y2="205.0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="366,205 379.0,197.0 379.0,213.0" fill="currentColor"/><text class="bt" x="445" y="197" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">4 hơi vào</text><text class="bt" x="432" y="222" font-size="18" text-anchor="start" fill="currentColor">ống dẫn hơi</text><text class="bt" x="385" y="270" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">3 phòng hơi</text><line class="bt" x1="383" y1="266" x2="358" y2="262" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g><g data-buoc="3"><line class="bt" x1="250" y1="375" x2="250" y2="410" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><rect class="bt" x="236" y="410" width="28" height="18" rx="3" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="3"/><text class="bt" x="250" y="452" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">6 van tháo nước ngưng</text><line class="bt" x1="135" y1="170" x2="100" y2="170" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><text class="bt" x="10" y="156" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">5 ống tháo</text><text class="bt" x="10" y="196" font-size="18" text-anchor="start" fill="currentColor">không ngưng</text></g><g data-buoc="4"><line class="bt" x1="365" y1="150" x2="365" y2="125" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><line class="bt" x1="365" y1="125" x2="380" y2="125" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path class="bt" d="M380 113 L380 137 L400 125 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text class="bt" x="408" y="118" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">7 van an toàn</text><line class="bt" x1="250" y1="150" x2="250" y2="118" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle class="bt" cx="250" cy="104" r="14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><text class="bt" x="275" y="100" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">8 áp kế</text></g><g data-buoc="5"><path class="bt" d="M138 335 L110 480 M362 335 L390 480 M100 480 L400 480" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text class="bt" x="420" y="508" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">9 giá đỡ</text></g><g data-buoc="6"><circle class="bt" cx="398" cy="340" r="22" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="3"/><line class="bt" x1="376" y1="340" x2="420" y2="340" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line class="bt" x1="398" y1="318" x2="398" y2="362" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line class="bt" x1="365" y1="340" x2="376" y2="340" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><text class="bt" x="430" y="322" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">10 tay quay</text><text class="bt" x="424" y="392" font-size="18" text-anchor="start" fill="currentColor">11 bánh răng</text><text class="bt" x="270" y="532" font-size="18" text-anchor="middle" fill="currentColor">Tay quay + bánh răng: nghiêng nồi để tháo (suy luận)</text></g></svg>