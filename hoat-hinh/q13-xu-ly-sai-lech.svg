<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 476" role="img" width="540" height="476"><title>Xử lý khi CCP có sai lệch</title><desc>Bốn khối hiện lần lượt: phát hiện vượt giới hạn tới hạn, đưa CCP trở lại kiểm soát, cô lập và đánh giá sản phẩm bị ảnh hưởng, rồi tái chế, chuyển mục đích hoặc hủy, tìm nguyên nhân gốc và ghi hồ sơ.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="38" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Hành động khắc phục khi sai lệch</text><g data-buoc="1"><line x1="8" y1="74" x2="8" y2="154" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="92" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · Phát hiện sai lệch</text><text x="24" y="120" font-size="18" text-anchor="start" class="bt" fill="currentColor">Giám sát thấy thông số vượt</text><text x="24" y="146" font-size="18" text-anchor="start" class="bt" fill="currentColor">giới hạn tới hạn tại CCP</text></g><g data-buoc="2"><line x1="8" y1="172" x2="8" y2="226" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="190" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · Đưa CCP về kiểm soát</text><text x="24" y="218" font-size="18" text-anchor="start" class="bt" fill="currentColor">Chỉnh thiết bị, chỉnh thông số</text></g><g data-buoc="3"><line x1="8" y1="244" x2="8" y2="324" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="262" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · Cô lập sản phẩm</text><text x="24" y="290" font-size="18" text-anchor="start" class="bt" fill="currentColor">Giữ lại hàng làm ra lúc sai lệch</text><text x="24" y="316" font-size="18" text-anchor="start" class="bt" fill="currentColor">Đánh giá độ an toàn</text></g><g data-buoc="4"><line x1="8" y1="342" x2="8" y2="448" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="360" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">4 · Quyết định và ghi lại</text><text x="24" y="388" font-size="18" text-anchor="start" class="bt" fill="currentColor">Tái chế, chuyển mục đích hoặc hủy</text><text x="24" y="414" font-size="18" text-anchor="start" class="bt" fill="currentColor">Tìm nguyên nhân gốc</text><text x="24" y="440" font-size="18" text-anchor="start" class="bt" fill="currentColor">Ghi sai lệch và khắc phục vào hồ sơ</text></g></svg>