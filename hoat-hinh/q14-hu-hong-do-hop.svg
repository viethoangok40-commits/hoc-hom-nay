<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 570" role="img" width="540" height="570"><title>Phân biệt hư hỏng đồ hộp</title><desc>Năm khối hiện lần lượt: hộp phồng chưa nói được nguyên nhân; vi sinh vật sinh khí; ăn mòn kim loại sinh khí hydro; nguyên nhân cơ lý; cách xử lý theo từng nhóm.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="36" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Ba nhóm nguyên nhân hư hỏng đồ hộp</text><g data-buoc="1"><line x1="8" y1="70" x2="8" y2="150" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="88" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · Hộp phồng: chưa biết nguyên nhân</text><text x="24" y="114" font-size="18" text-anchor="start" class="bt" fill="currentColor">Phồng chỉ là dấu hiệu bên ngoài;</text><text x="24" y="140" font-size="18" text-anchor="start" class="bt" fill="currentColor">hộp hỏng do vi sinh vật có thể không phồng</text></g><g data-buoc="2"><line x1="8" y1="170" x2="8" y2="250" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="188" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · Vi sinh vật sinh khí</text><text x="24" y="214" font-size="18" text-anchor="start" class="bt" fill="currentColor">CO₂, H₂S, NH₃ do thanh trùng thiếu,</text><text x="24" y="240" font-size="18" text-anchor="start" class="bt" fill="currentColor">làm nguội chậm, mối ghép hở, nhiễm trước</text></g><g data-buoc="3"><line x1="8" y1="270" x2="8" y2="350" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="288" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · Hóa học: ăn mòn kim loại</text><text x="24" y="314" font-size="18" text-anchor="start" class="bt" fill="currentColor">Acid ăn mòn lớp thiếc, khí hydro</text><text x="24" y="340" font-size="18" text-anchor="start" class="bt" fill="currentColor">thoát ra làm phồng; kim loại vào sản phẩm</text></g><g data-buoc="4"><line x1="8" y1="370" x2="8" y2="450" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="388" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">4 · Cơ lý: không có vi sinh vật</text><text x="24" y="414" font-size="18" text-anchor="start" class="bt" fill="currentColor">Bài khí không đủ, xếp quá đầy,</text><text x="24" y="440" font-size="18" text-anchor="start" class="bt" fill="currentColor">giảm áp suất quá nhanh, móp méo</text></g><g data-buoc="5"><line x1="8" y1="470" x2="8" y2="550" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="bt"/><text x="24" y="488" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">5 · Xử lý theo nguyên nhân</text><text x="24" y="514" font-size="18" text-anchor="start" class="bt" fill="currentColor">Vi sinh vật: hủy bỏ · hóa học nhẹ: chế biến</text><text x="24" y="540" font-size="18" text-anchor="start" class="bt" fill="currentColor">lại · cơ lý: thay bao bì, chế biến phụ</text></g></svg>