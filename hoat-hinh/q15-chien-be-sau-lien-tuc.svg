<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Thiết bị chiên bề sâu liên tục</title><desc>Sơ đồ khối: dầu gia nhiệt ở thiết bị trao đổi nhiệt rồi vào chảo; băng chuyền mang nguyên liệu ngập qua dầu; lớp gối nước dưới dầu; dầu được tháo liên tục qua lọc và trao đổi nhiệt rồi trở lại chảo; sản phẩm ra ở cuối băng chuyền.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s;animation-fill-mode:both}}</style><text x="10" y="34" font-size="22" font-weight="700" text-anchor="start" class="bt" fill="currentColor">Chiên bề sâu liên tục: dòng dầu</text><g data-buoc="1"><rect x="60" y="150" width="420" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="2" class="bt"/><text x="270" y="140" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">Chảo chiên hình hộp</text><rect x="62" y="200" width="416" height="70" rx="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="0" class="bt"/><text x="270" y="240" font-size="18" text-anchor="middle" class="bt" fill="currentColor">lớp dầu shortening</text><rect x="380" y="330" width="150" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="2" class="bt"/><text x="455" y="356" font-size="18" text-anchor="middle" class="bt" fill="currentColor">Trao đổi</text><text x="455" y="378" font-size="18" text-anchor="middle" class="bt" fill="currentColor">nhiệt</text><line x1="455" y1="330" x2="455" y2="302" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="455.0,302.0 459.3,311.0 450.7,311.0" fill="currentColor" class="bt"/><text x="10" y="70" font-size="20" font-weight="700" text-anchor="start" class="bt" fill="currentColor">1 · Dầu gia nhiệt ngoài chảo</text><text x="10" y="96" font-size="18" text-anchor="start" class="bt" fill="currentColor">rồi bơm vào chảo</text></g><g data-buoc="2"><line x1="20" y1="190" x2="90" y2="190" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="90.0,190.0 81.0,194.3 81.0,185.7" fill="currentColor" class="bt"/><line x1="90" y1="190" x2="450" y2="190" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 6" class="bt"/><line x1="450" y1="190" x2="520" y2="170" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="520.0,170.0 512.5,176.7 510.1,168.3" fill="currentColor" class="bt"/><text x="20" y="180" font-size="18" text-anchor="start" class="bt" fill="currentColor">vào</text><rect x="130" y="198" width="30" height="22" rx="6" fill="none" stroke="currentColor" stroke-width="2" class="bt"/><rect x="220" y="198" width="30" height="22" rx="6" fill="none" stroke="currentColor" stroke-width="2" class="bt"/><rect x="310" y="198" width="30" height="22" rx="6" fill="none" stroke="currentColor" stroke-width="2" class="bt"/><text x="10" y="440" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">2 · Băng chuyền đưa nguyên liệu ngập qua dầu</text></g><g data-buoc="3"><rect x="62" y="270" width="416" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4" class="bt"/><text x="270" y="290" font-size="18" text-anchor="middle" class="bt" fill="currentColor">lớp gối nước</text><text x="10" y="468" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">3 · Gối nước dưới dầu: tiết kiệm dầu, ít hư hỏng</text></g><g data-buoc="4"><line x1="120" y1="300" x2="120" y2="350" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="120.0,350.0 115.7,341.0 124.3,341.0" fill="currentColor" class="bt"/><rect x="40" y="350" width="150" height="40" rx="6" fill="none" stroke="currentColor" stroke-width="2" class="bt"/><text x="115" y="377" font-size="18" text-anchor="middle" class="bt" fill="currentColor">Lọc</text><line x1="190" y1="370" x2="380" y2="370" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="bt"/><polygon points="380.0,370.0 371.0,374.3 371.0,365.7" fill="currentColor" class="bt"/><text x="285" y="362" font-size="18" text-anchor="middle" class="bt" fill="currentColor">bơm</text><text x="10" y="496" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">4 · Tháo dầu liên tục → lọc → trao đổi nhiệt → chảo</text></g><g data-buoc="5"><text x="470" y="130" font-size="18" font-weight="700" text-anchor="middle" class="bt" fill="currentColor">sản phẩm</text><text x="10" y="524" font-size="18" font-weight="700" text-anchor="start" class="bt" fill="currentColor">5 · Băng chuyền đưa sản phẩm chiên ra</text></g></svg>