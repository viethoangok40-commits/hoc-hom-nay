<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Vào hộp nóng, ghép nắp, làm nguội tạo độ chân không</title><desc>Sơ đồ bốn bước: sản phẩm vào hộp lúc nóng nên khoảng trống đầu hộp chứa hơi nước và ít không khí; ghép nắp kín; khi làm nguội hơi nước ngưng tụ, khí co lại nên áp suất trong hộp giảm và tạo độ chân không; theo bảng slide, ghép nắp ở 50 °C cho 220 mmHg còn ở 90 °C cho 482,6 mmHg.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="10" y="32" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Bài khí bằng nhiệt rồi làm nguội</text><path class="bt" d="M60 110 L60 330 L220 330 L220 110" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect class="bt" x="60" y="170" width="160" height="160" rx="0" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="0"/><text class="bt" x="140" y="265" font-size="18" text-anchor="middle" fill="currentColor">sản phẩm nóng</text><circle class="bt" cx="95" cy="145" r="7" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="130" cy="140" r="7" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="165" cy="148" r="7" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><circle class="bt" cx="195" cy="140" r="7" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="3"/><text class="bt" x="300" y="140" font-size="18" text-anchor="start" fill="currentColor">khoảng trống đầu hộp:</text><text class="bt" x="300" y="164" font-size="18" text-anchor="start" fill="currentColor">hơi nước + ít không khí</text><text class="bt" x="140" y="360" font-size="18" text-anchor="middle" fill="currentColor">1. Vào hộp lúc nóng</text></g><g data-buoc="2"><line class="bt" x1="52" y1="108" x2="228" y2="108" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><text class="bt" x="300" y="108" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">2. Ghép nắp kín</text></g><g data-buoc="3"><line class="bt" x1="95" y1="120" x2="95" y2="155" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path class="bt" d="M90.2 146.2 L95 155 L99.8 146.2" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line class="bt" x1="165" y1="120" x2="165" y2="155" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path class="bt" d="M160.2 146.2 L165 155 L169.8 146.2" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text class="bt" x="300" y="205" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">3. Làm nguội: hơi nước</text><text class="bt" x="300" y="229" font-size="18" font-weight="700" text-anchor="start" fill="currentColor">ngưng tụ, khí co lại</text><text class="bt" x="300" y="253" font-size="18" text-anchor="start" fill="currentColor">→ áp suất trong hộp giảm,</text><text class="bt" x="300" y="277" font-size="18" text-anchor="start" fill="currentColor">tạo độ chân không</text></g><g data-buoc="4"><text class="bt" x="270" y="410" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">4. Bảng slide 13 (sau làm nguội)</text><text class="bt" x="20" y="450" font-size="18" text-anchor="start" fill="currentColor">ghép 50 °C</text><rect class="bt" x="130" y="434" width="132" height="22" rx="2" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><text class="bt" x="270" y="452" font-size="18" text-anchor="start" fill="currentColor">220 mmHg</text><text class="bt" x="20" y="492" font-size="18" text-anchor="start" fill="currentColor">ghép 90 °C</text><rect class="bt" x="130" y="476" width="290" height="22" rx="2" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2"/><text class="bt" x="414" y="520" font-size="18" text-anchor="end" fill="currentColor">482,6 mmHg</text></g></svg>