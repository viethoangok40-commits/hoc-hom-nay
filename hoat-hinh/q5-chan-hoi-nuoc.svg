<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Hệ thống chần bằng hơi nước (sơ đồ khối)</title><desc>Sơ đồ khối theo chú thích slide: nguyên liệu vào cửa nạp 5, thiết bị nâng 1, đường hầm gia nhiệt bằng hơi nước 2 (hơi vào qua cửa 6), thiết bị nâng 3 nơi xảy ra chần, vùng làm nguội 4, rồi ra cửa tháo sản phẩm 7.</desc><style>.bt{animation:bt 1.2s ease-in-out both}@keyframes bt{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bt{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><text class="bt" x="10" y="36" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">Chần bằng hơi nước (sơ đồ khối)</text><rect class="bt" x="15" y="110" width="150" height="84" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="90.0" y="144" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">5 Cửa nạp</text><text class="bt" x="90.0" y="172" font-size="18" text-anchor="middle" fill="currentColor">nguyên liệu</text><line class="bt" x1="165" y1="152" x2="185" y2="152" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="195,152 181,143 181,161" fill="currentColor"/><rect class="bt" x="195" y="110" width="150" height="84" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="270.0" y="144" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">1 Nâng đưa</text><text class="bt" x="270.0" y="172" font-size="18" text-anchor="middle" fill="currentColor">lên gia nhiệt</text></g><g data-buoc="2"><rect class="bt" x="375" y="110" width="150" height="84" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="450.0" y="144" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">2 Hầm gia nhiệt</text><text class="bt" x="450.0" y="172" font-size="18" text-anchor="middle" fill="currentColor">bằng hơi nước</text><line class="bt" x1="345" y1="152" x2="365" y2="152" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="375,152 361,143 361,161" fill="currentColor"/><text class="bt" x="450" y="74" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">6 Cửa nạp hơi</text><line class="bt" x1="450" y1="84" x2="450" y2="100" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="450,110 441,96 459,96" fill="currentColor"/></g><g data-buoc="3"><line class="bt" x1="450" y1="194" x2="450" y2="290" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="450,300 441,286 459,286" fill="currentColor"/><rect class="bt" x="375" y="300" width="150" height="84" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="450.0" y="334" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">3 Nâng: nơi</text><text class="bt" x="450.0" y="362" font-size="18" text-anchor="middle" fill="currentColor">xảy ra chần</text><text class="bt" x="525" y="410" font-size="18" text-anchor="end" fill="currentColor">lưu ở đây = thời gian chần</text></g><g data-buoc="4"><line class="bt" x1="375" y1="342" x2="355" y2="342" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="345,342 359,333 359,351" fill="currentColor"/><rect class="bt" x="195" y="300" width="150" height="84" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="270.0" y="334" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">4 Vùng làm</text><text class="bt" x="270.0" y="362" font-size="18" text-anchor="middle" fill="currentColor">nguội</text><text class="bt" x="270" y="450" font-size="18" text-anchor="middle" fill="currentColor">Làm nguội bằng không khí lạnh tuần hoàn</text></g><g data-buoc="5"><line class="bt" x1="195" y1="342" x2="175" y2="342" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><polygon class="bt" points="165,342 179,333 179,351" fill="currentColor"/><rect class="bt" x="15" y="300" width="150" height="84" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="3"/><text class="bt" x="90.0" y="334" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">7 Cửa tháo</text><text class="bt" x="90.0" y="362" font-size="18" text-anchor="middle" fill="currentColor">sản phẩm</text><text class="bt" x="270" y="490" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">Thứ tự: 5 → 1 → 2 → 3 → 4 → 7</text><text class="bt" x="10" y="525" font-size="18" text-anchor="start" fill="currentColor">Sơ đồ khối tự vẽ theo chú thích slide</text></g></svg>