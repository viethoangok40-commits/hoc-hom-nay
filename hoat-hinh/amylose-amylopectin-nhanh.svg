<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" width="540" height="540"><title>Amylose là chuỗi thẳng nối α-1,4; amylopectin có thêm nhánh nối α-1,6 khoảng mỗi 25–30 gốc glucose</title><desc>Bốn khung: chuỗi các gốc glucose G nối α-1,4 không nhánh là amylose; amylopectin có cùng khung chuỗi chính; một nhánh gắn bằng liên kết α-1,6; điểm nhánh lặp lại khoảng mỗi 25–30 gốc.</desc><style>.hb-p{animation:hb-p 1.2s ease-in-out both}@keyframes hb-p{from{opacity:.15}to{opacity:1}}@media (prefers-reduced-motion:reduce){.hb-p{animation-duration:.001ms;animation-delay:0s}}</style><g data-buoc="1"><g transform="translate(5,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">1 · Amylose</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">chuỗi thẳng, không nhánh</text><line x1="35" y1="55" x2="50" y2="55" stroke="currentColor" stroke-width="3"/><line x1="80" y1="55" x2="95" y2="55" stroke="currentColor" stroke-width="3"/><line x1="125" y1="55" x2="140" y2="55" stroke="currentColor" stroke-width="3"/><line x1="170" y1="55" x2="185" y2="55" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="20" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="65" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="110" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="110" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="155" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="155" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="200" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="200" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><text x="0" y="182" font-size="18" text-anchor="start" fill="currentColor">G là một gốc glucose;</text><text x="0" y="206" font-size="18" text-anchor="start" fill="currentColor">liên kết giữa các G là α-1,4</text></g></g><g data-buoc="2"><g transform="translate(285,50)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">2 · Amylopectin</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">cùng khung chuỗi chính</text><line x1="35" y1="55" x2="50" y2="55" stroke="currentColor" stroke-width="3"/><line x1="80" y1="55" x2="95" y2="55" stroke="currentColor" stroke-width="3"/><line x1="125" y1="55" x2="140" y2="55" stroke="currentColor" stroke-width="3"/><line x1="170" y1="55" x2="185" y2="55" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="20" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="65" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="110" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="110" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="155" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="155" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="200" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="200" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><text x="0" y="182" font-size="18" text-anchor="start" fill="currentColor">chuỗi chính cũng nối</text><text x="0" y="206" font-size="18" text-anchor="start" fill="currentColor">bằng α-1,4</text></g></g><g data-buoc="3"><g transform="translate(5,320)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">3 · Một nhánh</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">nối vào chuỗi chính</text><line x1="35" y1="55" x2="50" y2="55" stroke="currentColor" stroke-width="3"/><line x1="80" y1="55" x2="95" y2="55" stroke="currentColor" stroke-width="3"/><line x1="125" y1="55" x2="140" y2="55" stroke="currentColor" stroke-width="3"/><line x1="170" y1="55" x2="185" y2="55" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="20" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="65" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="110" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="110" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="155" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="155" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="200" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="200" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><line x1="110" y1="70" x2="110" y2="85" stroke="currentColor" stroke-width="3"/><circle cx="110" cy="100" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="110" y="106" font-size="18" text-anchor="middle" fill="currentColor">G</text><line x1="110" y1="115" x2="110" y2="125" stroke="currentColor" stroke-width="3"/><circle cx="110" cy="140" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="110" y="146" font-size="18" text-anchor="middle" fill="currentColor">G</text><rect x="90" y="66" width="40" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="7 6" class="hb-p"/><text x="135" y="100" font-size="18" text-anchor="start" fill="currentColor" class="hb-p">α-1,6</text><text x="0" y="182" font-size="18" text-anchor="start" fill="currentColor">nhánh gắn bằng liên kết</text><text x="0" y="206" font-size="18" text-anchor="start" fill="currentColor">α-1,6 (khung nét đứt)</text></g></g><g data-buoc="4"><g transform="translate(285,320)"><text x="0" y="-34" font-size="22" font-weight="700" text-anchor="start" fill="currentColor">4 · Nhánh lặp lại</text><text x="0" y="-10" font-size="18" text-anchor="start" fill="currentColor">khoảng mỗi 25–30 gốc</text><line x1="35" y1="55" x2="50" y2="55" stroke="currentColor" stroke-width="3"/><line x1="80" y1="55" x2="95" y2="55" stroke="currentColor" stroke-width="3"/><line x1="125" y1="55" x2="140" y2="55" stroke="currentColor" stroke-width="3"/><line x1="170" y1="55" x2="185" y2="55" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="20" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="65" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="110" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="110" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="155" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="155" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><circle cx="200" cy="55" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="200" y="61" font-size="18" text-anchor="middle" fill="currentColor">G</text><line x1="65" y1="70" x2="65" y2="85" stroke="currentColor" stroke-width="3"/><circle cx="65" cy="100" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="106" font-size="18" text-anchor="middle" fill="currentColor">G</text><line x1="200" y1="70" x2="200" y2="85" stroke="currentColor" stroke-width="3"/><circle cx="200" cy="100" r="15" fill="none" stroke="currentColor" stroke-width="3"/><text x="200" y="106" font-size="18" text-anchor="middle" fill="currentColor">G</text><text x="30" y="140" font-size="18" text-anchor="start" fill="currentColor">nhánh</text><path d="M20 31 L20 25 L200 25 L200 31" fill="none" stroke="currentColor" stroke-width="3" class="hb-p"/><text x="110" y="19" font-size="18" text-anchor="middle" fill="currentColor" class="hb-p">~25–30 gốc</text><text x="0" y="182" font-size="18" text-anchor="start" fill="currentColor">nhiều điểm nhánh dọc</text><text x="0" y="206" font-size="18" text-anchor="start" fill="currentColor">chuỗi (hình không đúng tỉ lệ)</text></g></g></svg>